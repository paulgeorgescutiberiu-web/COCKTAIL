<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cocktail Philosophy · Rețetar și evenimente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style id="css">
:root{
  --leaf:#14432F; --leaf-deep:#0C2C1F; --gold:#C99A2E; --sun:#F4C918;
  --paper:#EDF0E3; --card:#F8F9F2; --ink:#16241C; --muted:#56655B;
  --line:#CBD3C0; --sage:#BCD1AB; --lime:#E4EB7A; --on-leaf:#F3F5EC; --danger:#A3321F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A14; --card:#15251C; --ink:#E6ECDF; --muted:#9DAC9F;
    --line:#284134; --leaf:#1B5A3F; --leaf-deep:#123826; --sage:#3E5A43; --lime:#6F7430; --danger:#F08A73;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A14; --card:#15251C; --ink:#E6ECDF; --muted:#9DAC9F;
  --line:#284134; --leaf:#1B5A3F; --leaf-deep:#123826; --sage:#3E5A43; --lime:#6F7430; --danger:#F08A73;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.display{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;line-height:.9;letter-spacing:.01em}
body.readonly .edit-only{display:none!important}
body:not(.readonly) .ro-only{display:none!important}

header{position:relative;overflow:hidden;background:var(--leaf-deep);color:var(--on-leaf);padding:22px 20px 0}
header .leafdeco{position:absolute;right:-40px;top:-30px;width:230px;height:250px;opacity:.13;pointer-events:none}
header .leafdeco.two{right:auto;left:-70px;top:70px;width:170px;height:190px;transform:rotate(160deg);opacity:.08}
.brandrow{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:980px;margin:0 auto}
.brand{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:.04em;color:var(--gold)}
.themebtn{background:none;border:1px solid rgba(243,245,236,.3);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--on-leaf);cursor:pointer}
h1{position:relative;max-width:980px;margin:14px auto 18px;font-size:clamp(3.2rem,13vw,6.4rem);font-weight:900;text-transform:uppercase}
h1 .yr{display:block;color:var(--sun)}
nav.tabs{position:relative;display:flex;gap:4px;max-width:980px;margin:0 auto}
nav.tabs button{flex:1 1 0;background:transparent;border:0;border-radius:12px 12px 0 0;padding:12px 8px;font-weight:600;color:rgba(243,245,236,.75);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}

main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.view[hidden]{display:none}
.notice{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px;color:var(--muted);font-size:.92rem}
.notice[hidden]{display:none}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.seg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:.92rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf)}

.list{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.list li{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:end;width:100%;text-align:left;background:none;border:0;padding:16px 4px 14px;cursor:pointer}
.row:hover .rname{color:var(--leaf)}
:root[data-theme="dark"] .row:hover .rname{color:var(--sun)}
.rname{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:clamp(2.1rem,7vw,3.3rem);line-height:.9;text-transform:uppercase}
.rname .zero,.pname .zero,.cname .zero,.oname .zero{font-weight:500;color:var(--gold)}
.rmeta{grid-column:1;color:var(--muted);font-size:.93rem}
.rtech{grid-row:1 / span 2;grid-column:2;align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.02em}
.chip.tech{background:var(--leaf);color:var(--on-leaf)}
.chip.nz{background:var(--lime);color:#2B3310}
:root[data-theme="dark"] .chip.nz{color:var(--ink)}
.empty{padding:30px 4px;color:var(--muted)}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,20,14,.55)}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:980px;max-height:92%;overflow:auto;background:var(--paper);border-radius:20px 20px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pname{margin:4px 0 6px;font-size:clamp(2.8rem,11vw,5.2rem);font-weight:900;text-transform:uppercase;overflow-wrap:anywhere}
.pactions{display:flex;gap:8px;flex:none}
.close{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer}
.glass{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem;margin-bottom:14px}
.glass svg{width:26px;height:26px}
.servings{display:flex;align-items:center;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.stepper button{width:42px;height:40px;border:0;background:none;font-size:1.25rem;cursor:pointer}
.stepper output{min-width:36px;text-align:center;font-weight:700}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.cols{grid-template-columns:1fr 1.25fr .9fr}}
.box{border-radius:14px;overflow:hidden;border:1.5px solid var(--ink)}
.box h3{margin:0;padding:12px 16px;font-size:.95rem;font-weight:700;border-bottom:1.5px solid var(--ink)}
.box .in{padding:14px 16px}
.box.ing{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.box.ing h3{border-color:rgba(243,245,236,.25)}
.box.met{background:var(--card)}
.box.gar{background:var(--sun);color:#2A2305;border-color:#C9A40B}
.box.gar h3{border-color:#C9A40B}
.panel.nz .box.ing{background:var(--sage);color:var(--ink);border-color:var(--sage)}
.panel.nz .box.ing h3{border-color:rgba(22,36,28,.2)}
.panel.nz .box.gar{background:var(--lime);color:#2B3310;border-color:#B9C043}
:root[data-theme="dark"] .panel.nz .box.gar{color:var(--ink)}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:grid;grid-template-columns:5.2rem 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(243,245,236,.22)}
.panel.nz .ings li{border-color:rgba(22,36,28,.18)}
.ings li:last-child{border-bottom:0}
.q{font-weight:700;font-variant-numeric:tabular-nums}
.techline{margin:0 0 10px;font-weight:600}
.techline b{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:1.35rem;font-weight:900;letter-spacing:.02em}
ol.steps{margin:0;padding-left:1.3rem}
ol.steps li{margin-bottom:8px}
ol.steps li strong{color:var(--leaf)}
:root[data-theme="dark"] ol.steps li strong{color:var(--sun)}
.gar p{margin:0 0 6px;font-weight:600}

/* Editor */
.editor h2{margin:4px 0 14px;font-size:clamp(2.2rem,8vw,3.4rem);font-weight:900;text-transform:uppercase}
.fgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px}
@media (min-width:700px){.fgrid{grid-template-columns:2fr 1fr 1fr}}
.field{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
.editor input[type=text],.editor input[type=number],.editor select{width:100%;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-weight:500;font-size:1rem}
.editor input:disabled{opacity:.45}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--leaf)}
.fset{border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px 14px;margin:0 0 14px;background:var(--card)}
.fset legend{padding:0 6px;font-weight:700}
.fset .hint{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.erow{display:grid;gap:6px;margin-bottom:8px;align-items:center}
.ing-row{grid-template-columns:5rem 7rem 1fr 8rem 40px;grid-template-areas:"q u n k x"}
.ing-row .f-q{grid-area:q}.ing-row .f-u{grid-area:u}.ing-row .f-n{grid-area:n}.ing-row .f-k{grid-area:k}.ing-row .x{grid-area:x}
@media (max-width:640px){.ing-row{grid-template-columns:4.5rem 1fr 1fr 40px;grid-template-areas:"q u k x" "n n n n";padding-bottom:8px;border-bottom:1px dashed var(--line)}}
.txt-row{grid-template-columns:1fr 40px}
.x{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:1.15rem}
.add{border:1.5px dashed var(--line);background:none;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.ebar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
  background:var(--paper);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line)}
.ebar .grp{display:flex;gap:10px}
.err{color:var(--danger);font-weight:600;margin:0 0 12px}
.err:empty{display:none}

.lead{color:var(--muted);max-width:62ch;margin:0 0 16px}
.calc{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:820px){.calc{grid-template-columns:1fr 1fr}}
.orders{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.orders li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.orders .oname{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;font-size:1.5rem;text-transform:uppercase;line-height:1}
.orders input{width:88px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--leaf)}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn:disabled{opacity:.55;cursor:progress}
.result{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:16px;align-self:start}
.result h2{margin:0 0 4px;font-size:2.2rem;font-weight:900;text-transform:uppercase}
.total{color:var(--muted);margin:0 0 12px}
.rgroup{margin-top:14px}
.rgroup h3{margin:0 0 6px;font-size:.95rem}
.rtable{width:100%;border-collapse:collapse;font-size:.95rem}
.rtable td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rtable td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.rtable small{color:var(--muted);font-weight:500}

.train{max-width:560px;margin:0 auto}
.card{position:relative;min-height:320px;border-radius:20px;border:1.5px solid var(--ink);background:var(--card);padding:22px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden}
.card .leafdeco{position:absolute;right:-50px;bottom:-60px;width:220px;height:240px;opacity:.07;pointer-events:none;color:var(--leaf)}
.card .cname{font-size:clamp(2.8rem,12vw,4.6rem);font-weight:900;text-transform:uppercase;margin:0}
.card .hint{color:var(--muted)}
.card.revealed{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.card.revealed .hint{color:rgba(243,245,236,.75)}
.card.revealed.zero{background:var(--sage);color:var(--ink);border-color:var(--sage)}
.card.revealed.zero .hint{color:var(--muted)}
.reveal{margin-top:12px}
.reveal p{margin:4px 0}
.tnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.count{color:var(--muted);font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);
  background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}

footer{max-width:980px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem}
footer a{color:inherit}
/* ---------- Evenimente ---------- */
:root{--soft:#E1E7D5;--warn:#8A5300;--warn-bg:#FBEFCF;--err:#A3321F;--err-bg:#F8E1DA;
  --c0:#C98A12;--c1:#B2304A;--c2:#2F7253;--c3:#3F4FA3;--c4:#D0602A;--c5:#7B3D82;--c6:#1D7F8C;--c7:#6B7A1E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--soft:#1D3226;--warn:#F2B650;--warn-bg:#2E2513;--err:#F08A73;--err-bg:#3A1C1E;
  --c0:#E0A73A;--c1:#E0607A;--c2:#4FA87E;--c3:#7F8EE6;--c4:#F0874F;--c5:#B77CC0;--c6:#45B3C1;--c7:#A8B94A}}
:root[data-theme="dark"]{--soft:#1D3226;--warn:#F2B650;--warn-bg:#2E2513;--err:#F08A73;--err-bg:#3A1C1E;
  --c0:#E0A73A;--c1:#E0607A;--c2:#4FA87E;--c3:#7F8EE6;--c4:#F0874F;--c5:#B77CC0;--c6:#45B3C1;--c7:#A8B94A}
nav.tabs{overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;padding:12px 12px}
.ev-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.ev-sub{margin:0;font-weight:700}
.ev-file{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.ev-alert{background:var(--err-bg);color:var(--err);border-radius:12px;padding:12px 16px;font-weight:700;margin-bottom:12px}
.ev-alert[hidden]{display:none}
.ev-tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin-bottom:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
.ev-tabs::-webkit-scrollbar{display:none}
.ev-tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:600;font-size:.95rem}
.ev-tab .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.ev-tab small{opacity:.7;font-weight:500}
.ev-tab[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ev-h2{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;text-transform:uppercase;font-size:1.7rem;line-height:1;margin:28px 0 10px}
.ev-h2 .cnt{font-family:Figtree,system-ui,sans-serif;text-transform:none;font-weight:500;font-size:.85rem;color:var(--muted);margin-left:6px}
.ev-timeline{display:flex;flex-direction:column;gap:10px}
.ev-trow{display:grid;grid-template-columns:64px 6px 1fr;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;width:100%}
.ev-trow:hover{border-color:var(--c)}
.ev-time{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:1.9rem;line-height:1}
.ev-time.none{font-family:Figtree,system-ui,sans-serif;font-weight:500;font-size:.85rem;color:var(--muted)}
.ev-bar{border-radius:3px;background:var(--c)}
.ev-name{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:1.8rem;line-height:.95;text-transform:uppercase}
.ev-meta{color:var(--muted);font-size:.93rem;margin-top:4px}
.ev-flag{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:.8rem;font-weight:600;border-radius:6px;padding:1px 8px;margin-top:6px}
.ev-checks{background:var(--warn-bg);border-radius:14px;padding:12px 18px}
.ev-checks ul{margin:0;padding-left:18px}
.ev-checks li{margin:6px 0}
.ev-checks b{color:var(--warn)}
.ev-ok{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;color:var(--muted)}
.ev-help{color:var(--muted);font-size:.92rem;margin-top:26px;max-width:62ch}
.ev-hero{position:relative;background:var(--card);border:1.5px solid var(--ink);border-radius:18px;overflow:hidden;padding:18px 18px 18px 30px}
.ev-hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--c)}
.ev-hero h2{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,10vw,4.4rem);line-height:.9;margin:0 0 16px;overflow-wrap:anywhere}
.ev-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
@media (min-width:640px){.ev-facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ev-fact .k{color:var(--muted);font-size:.85rem}
.ev-fact .v{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;font-size:1.7rem;line-height:1.05}
.ev-fact .v.missing{font-family:Figtree,system-ui,sans-serif;color:var(--warn);font-size:1rem;font-weight:700}
.ev-team{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ev-chip{background:var(--soft);border-radius:8px;padding:3px 10px;font-weight:700;font-size:.95rem}
.ev-note{margin-top:14px;border-left:4px solid var(--c);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0}
.ev-note .k{font-size:.85rem;color:var(--muted)}
.ev-note p{margin:2px 0;font-weight:700}
.ev-note button{margin-top:6px}
.ev-progress{display:flex;align-items:center;gap:12px;margin:20px 0 0}
.ev-pbar{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.ev-pbar i{display:block;height:100%;background:var(--c);transition:width .25s}
.ev-ptext{font-size:.92rem;color:var(--muted);white-space:nowrap}
.ev-link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-size:.88rem}
.ev-list{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.ev-item{display:flex;align-items:center;gap:10px;padding:0 16px 0 0;border-top:1px solid var(--line)}
.ev-item:first-child{border-top:0}
.ev-item label{flex:1;display:flex;align-items:center;gap:14px;padding:12px 0 12px 16px;cursor:pointer;user-select:none;min-width:0}

ld","ing":[{"q":40,"u":"ml","n":"Rom","k":"spirit"},{"q":2,"u":"pepenași","n":"Lime","k":"fruit"},{"q":null,"u":"top","n":"Coca-Cola","k":"other"}],"steps":["Stoarceți pepenașii de lime în pahar și lăsați-i înăuntru.","Build: adăugați gheața și romul.","Top: completați cu Coca-Cola și amestecați ușor."],"garnish":["Pepenaș de lime"],"sec":"cls","gust":"","ingM":"rom, lime, Coca-Cola","desc":""},{"id":"amaretto-sour","name":"Amaretto Sour","zero":false,"base":"Amaretto","glass":"","tech":"Shake & Strain","ing":[{"q":50,"u":"ml","n":"Disaronno","k":"spirit"},{"q":20,"u":"ml","n":"Suc de lămâie","k":"juice"},{"q":20,"u":"ml","n":"Suc de portocale","k":"juice"}],"steps":["Agitați energic ingredientele cu gheață în shaker.","Strecurați peste gheață proaspătă, direct în pahar."],"garnish":["Coajă de portocală"],"sec":"cls","gust":"","ingM":"Disaronno, portocală, lămâie","desc":""},{"id":"socrate","name":"Socrate","zero":true,"base":"Aloe Vera","glass":"both","tech":"Build sau Shake","ing":[{"q":null,"u":"după gust","n":"Suc de Aloe Vera","k":"juice"},{"q":20,"u":"ml","n":"Suc de lămâie","k":"juice"},{"q":20,"u":"ml","n":"Premix Platon","k":"premix"},{"q":null,"u":"top","n":"Apă minerală","k":"other"}],"steps":["Bază: adăugați apa minerală în pahar prima dată.","Turnați restul ingredientelor (Aloe Vera, lămâie, premix Platon).","Amestecați puternic pentru omogenizare."],"garnish":["Grapefruit (gref)"],"sec":"zero","gust":"0% alcool","ingM":"aloe vera, grapefruit, lămâie","desc":"Răcoritor, cu un final amărui."},{"id":"limonada-ghimbir","name":"Tesla","zero":true,"base":"Lămâie","glass":"both","tech":"Build","ing":[{"q":40,"u":"ml","n":"Fresh de lămâie","k":"juice"},{"q":40,"u":"ml","n":"Premix Erasmus","k":"premix"},{"q":null,"u":"top","n":"Apă minerală","k":"other"}],"steps":["Turnați apa minerală în pahar prima dată.","Adăugați fresh-ul de lămâie și premixul Erasmus (pentru notele de ghimbir).","Amestecați puternic cu lingurița de bar."],"garnish":["Mentă proaspătă"],"sec":"zero","gust":"0% alcool","ingM":"sirop de ghimbir, pere, lămâie, apă minerală","desc":"Spumos, cu scânteie de ghimbir."},{"id":"villa-lobos","name":"Villalobos","zero":true,"base":"Cranberry","glass":"both","tech":"Build sau Shake","ing":[{"q":null,"u":"după gust","n":"Suc de cranberry","k":"juice"},{"q":20,"u":"ml","n":"Suc de lămâie","k":"juice"},{"q":20,"u":"ml","n":"Premix Harmony","k":"premix"},{"q":null,"u":"top","n":"Apă minerală","k":"other"}],"steps":["Turnați apa minerală în pahar prima dată.","Construiți băutura adăugând premixul și sucurile (lămâie, cranberry).","Amestecați puternic cu lingurița sau folosiți Shake înainte de a turna peste apa minerală."],"garnish":["Portocală"],"sec":"zero","gust":"0% alcool","ingM":"lychee, cranberry, lămâie","desc":"Roz, fructat, ușor acrișor."},{"id":"green-apple","name":"Special Green Apple","zero":true,"base":"Măr verde","glass":"both","tech":"Build sau Shake","ing":[{"q":null,"u":"după gust","n":"Suc de măr verde","k":"juice"},{"q":3,"u":"pepenași","n":"Lime","k":"fruit"},{"q":20,"u":"ml","n":"Premix Whiskey Sour","k":"premix"},{"q":null,"u":"top","n":"Apă minerală","k":"other"}],"steps":["Bază: apă minerală în pahar prima dată.","Adăugați bucățile de lime, premixul și sucul de măr.","Amestecați puternic pentru a integra aromele."],"garnish":["Măr deshidratat","Portocală deshidratată"],"sec":"zero","gust":"0% alcool","ingM":"mere verzi, scorțișoară & migdale, lămâie","desc":"Ca o plăcintă cu mere, dar rece."}]</script>
<script id="events-data" type="application/json">null</script>
<script id="app" type="text/plain">
(function(){
const HEAD = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Cocktail Philosophy · Rețetar și evenimente</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">\n<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>\n';
const shell = document.getElementById("shell");
document.body.insertBefore(shell.content.cloneNode(true), shell);

let R = JSON.parse(document.getElementById("recipes-data").textContent);
let EVD = (()=>{try{return JSON.parse(document.getElementById("events-data").textContent)}catch(e){return null}})();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k,d){try{const v=localStorage.getItem("cp-"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("cp-"+k,JSON.stringify(v))}catch(e){}}
};
const sess = {
  get(k){try{return sessionStorage.getItem("cp-"+k)}catch(e){return null}},
  set(k,v){try{v==null?sessionStorage.removeItem("cp-"+k):sessionStorage.setItem("cp-"+k,v)}catch(e){}}
};
const UNITS = ["ml","buc","wedges","pepenași","felii","top","stropi","după gust"];
const NOQ = ["top","stropi","după gust"];
const KINDS = {spirit:"Spirtoase",premix:"Premixuri",juice:"Sucuri",fruit:"Fructe",other:"Altele"};
const fmt = n => (Math.round(n*10)/10).toLocaleString("ro-RO");
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function qty(i,n){
  if(i.q===null || NOQ.includes(i.u)) return cap(i.u||"după gust");
  const v=i.q*n;
  if(i.u==="ml") return fmt(v)+" ml";
  if(i.u==="buc") return (v===0.5?"½":fmt(v))+" buc";
  return fmt(v)+" "+i.u;
}
function stepHTML(s){const m=String(s).match(/^([^:]{1,24}):\s*(.*)$/);return m?`<strong>${esc(m[1])}:</strong> ${esc(m[2])}`:esc(s)}
function glassHTML(g){
  if(g==="glob") return `<div class="glass"><svg><use href="#g-glob"/></svg>Pahar glob</div>`;
  if(g==="jar") return `<div class="glass"><svg><use href="#g-jar"/></svg>Pahar borcănaș</div>`;
  if(g==="both") return `<div class="glass"><svg><use href="#g-glob"/></svg><svg><use href="#g-jar"/></svg>Glob sau borcănaș</div>`;
  return "";
}
const nameHTML = r => esc(r.name)+(r.zero?` <span class="zero">0%</span>`:"");
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200)}

/* ---------- Saving ---------- */
let art = undefined, readOnly = false;
const artReady = (async()=>{
  try{ if(!window.claude || !window.claude.use) return null; return await window.claude.use("artifact"); }catch(e){ return null; }
})();
artReady.then(async a=>{
  art=a;
  if(!a){
    const local=store.get("recipes",null);
    if(Array.isArray(local)){R=local;refreshAll()}
    $("#localNotice").hidden=false;
    return;
  }
  try{
    const u=await window.claude.use("user");
    if(u && (await u.canEdit())===false) setReadOnly();
  }catch(e){}
});
function setReadOnly(){readOnly=true;document.body.classList.add("readonly")}
function buildHTML(list,ev){
  const json=JSON.stringify(list).replace(/</g,"\\u003c");
  const evj=JSON.stringify(ev===undefined?EVD:ev).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"ro\">\n<head>\n"+HEAD+
    "<style id=\"css\">"+document.getElementById("css").textContent+"</style>\n</head>\n<body>\n"+
    "<template id=\"shell\">"+shell.innerHTML+"</template>\n"+
    "<script id=\"recipes-data\" type=\"application/json\">"+json+"<\/script>\n"+
    "<script id=\"events-data\" type=\"application/json\">"+evj+"<\/script>\n"+
    "<script id=\"app\">"+document.getElementById("app").textContent+"<\/script>\n</body>\n</html>\n";
}
async function persist(next, openId, okMsg){
  const a = await artReady;
  if(!a){
    R=next;store.set("recipes",R);refreshAll();
    if(openId) openRecipe(openId); else closeSheet();
    toast(okMsg+" (doar în acest browser)");
    return true;
  }
  const attempt = () => a.publish(buildHTML(next));
  sess.set("open",openId||"");sess.set("okmsg",okMsg);
  try{ await attempt(); }
  catch(e){
    let code=e&&e.code;
    if(code==="upstream_error"){ await new Promise(r=>setTimeout(r,800+Math.random()*900)); try{await attempt();code=null}catch(e2){code=e2&&e2.code||"upstream_error"} }
    if(code){
      sess.set("open",null);sess.set("okmsg",null);
      if(code==="conflict") toast("Altcineva a salvat o versiune mai nouă. Pagina se reîncarcă; refă modificarea după aceea.");
      else if(["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].includes(code)){setReadOnly();toast("Poți vedea rețetele, dar nu ai drept să le modifici.");closeSheet()}
      else if(code==="rate_limited") toast("Prea multe salvări într-un timp scurt. Încearcă din nou peste un minut.");
      else if(code==="too_large") toast("Rețetarul a depășit dimensiunea maximă și nu a fost salvat.");
      else toast("Salvarea nu a reușit. Încearcă din nou.");
      return false;
    }
  }
  R=next;refreshAll();
  return true;
}

/* ---------- Tabs & theme ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+b.dataset.view);
  store.set("tab",b.dataset.view);
}));
{const t=store.get("tab","evenimente");const b=document.querySelector(`nav.tabs button[data-view="${t}"]`);if(b)b.click();}
const themes=[null,"light","dark"],tlabel={null:"Temă: auto",light:"Temă: luminoasă",dark:"Temă: întunecată"};
let theme=store.get("theme",null);
function applyTheme(){theme?document.documentElement.setAttribute("data-theme",theme):document.documentElement.removeAttribute("data-theme");$("#themeBtn").textContent=tlabel[theme]}
$("#themeBtn").onclick=()=>{theme=themes[(themes.indexOf(theme)+1)%3];store.set("theme",theme);applyTheme()};
applyTheme();

/* ---------- List ---------- */
let filter="all";
function renderList(){
  const q=$("#q").value.trim().toLowerCase();
  const items=R.filter(r=>filter==="all"||(filter==="zero")===!!r.zero)
    .filter(r=>!q||[r.name,r.base,r.tech,...r.ing.map(i=>i.n)].join(" ").toLowerCase().includes(q));
  $("#list").innerHTML=items.length?items.map(r=>{
    const pm=r.ing.find(i=>i.k==="premix");
    return `<li><button class="row" type="button" data-id="${esc(r.id)}">
      <span class="rname">${nameHTML(r)}</span>
      <span class="rmeta">${[r.base,pm&&pm.n].filter(Boolean).map(esc).join(" · ")}</span>
      <span class="rtech">${r.tech?`<span class="chip tech">${esc(r.tech)}</span>`:""}${r.zero?'<span class="chip nz">Fără alcool</span>':""}</span>
    </button></li>`}).join(""):`<li class="empty">Niciun cocktail nu se potrivește căutării.</li>`;
}
$("#q").addEventListener("input",renderList);
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.f;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderList()}));
$("#list").addEventListener("click",e=>{const b=e.target.closest(".row");if(b)openRecipe(b.dataset.id,b)});
$("#newBtn").addEventListener("click",e=>{lastFocus=e.currentTarget;openEditor(null)});

/* ---------- Detail ---------- */
let current=null,servings=1,lastFocus=null;
function showSheet(){$("#sheet").hidden=false;document.body.style.overflow="hidden";$("#panel").scrollTop=0}
function closeSheet(){$("#sheet").hidden=true;document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function openRecipe(id,from){const r=R.find(x=>x.id===id);if(!r)return;current=r;servings=1;if(from)lastFocus=from;renderDetail();showSheet();$("#panel .close").focus()}
function renderDetail(){
  const r=current;
  $("#panel").className="panel"+(r.zero?" nz":"");
  $("#panel").innerHTML=`
    <div class="phead"><h2 class="pname display" id="pname">${nameHTML(r)}</h2>
      <div class="pactions"><button class="btn edit-only" type="button" data-act="edit">Editează</button><button class="close" type="button" aria-label="Închide" data-act="close">×</button></div></div>
    ${glassHTML(r.glass)}
    <div class="servings"><span>Porții</span>
      <div class="stepper"><button type="button" data-d="-1" aria-label="Mai puține porții">−</button><output>${servings}</output><button type="button" data-d="1" aria-label="Mai multe porții">+</button></div></div>
    <div class="cols">
      <section class="box ing"><h3>Ingrediente</h3><div class="in"><ul class="ings">
        ${r.ing.map(i=>`<li><span class="q">${esc(qty(i,servings))}</span><span>${esc(i.n)}</span></li>`).join("")}
      </ul></div></section>
      <section class="box met"><h3>Metodă de preparare</h3><div class="in">
        ${r.tech?`<p class="techline">Tehnică: <b>${esc(r.tech)}</b></p>`:""}
        <ol class="steps">${r.steps.map(s=>`<li>${stepHTML(s)}</li>`).join("")}</ol></div></section>
      <section class="box gar"><h3>Garnish</h3><div class="in">${r.garnish.map(g=>`<p>${esc(g)}</p>`).join("")}</div></section>
    </div>`;
}

/* ---------- Editor ---------- */
let editing=null;
const opt=(v,l,sel)=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(l)}</option>`;
function ingRow(i){
  i=i||{q:null,u:"ml",n:"",k:"juice"};const noq=NOQ.includes(i.u);
  return `<div class="erow ing-row">
    <input class="f-q" type="number" min="0" step="any" inputmode="decimal" aria-label="Cantitate" value="${i.q===null||noq?"":i.q}"${noq?" disabled":""}>
    <select class="f-u" aria-label="Unitate">${UNITS.map(u=>opt(u,u,i.u)).join("")}</select>
    <input class="f-n" type="text" aria-label="Ingredient" placeholder="Ingredient" value="${esc(i.n)}">
    <select class="f-k" aria-label="Categorie în necesar">${Object.entries(KINDS).map(([k,l])=>opt(k,l,i.k||"other")).join("")}</select>
    <button class="x" type="button" data-act="rm" aria-label="Elimină">×</button></div>`;
}
const txtRow=(v,ph)=>`<div class="erow txt-row"><input type="text" value="${esc(v||"")}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"><button class="x" type="button" data-act="rm" aria-label="Elimină">×</button></div>`;
function openEditor(r){
  editing=r?r.id:null;
  r=r||{name:"",zero:false,base:"",glass:"",tech:"",ing:[],steps:[],garnish:[]};
  $("#panel").className="panel";
  $("#panel").innerHTML=`<div class="editor">
    <div class="phead"><h2 class="display" id="pname">${editing?"Editează rețeta":"Rețetă nouă"}</h2>
      <button class="close" type="button" aria-label="Închide" data-act="cancel">×</button></div>
    <p class="err" id="ferr"></p>
    <div class="fgrid">
      <label class="field">Nume<input type="text" id="f-name" value="${esc(r.name)}"></label>
      <label class="field">Bază<input type="text" id="f-base" value="${esc(r.base)}" placeholder="ex. Gin"></label>
      <label class="field">Tehnică<input type="text" id="f-tech" value="${esc(r.tech)}" placeholder="ex. Shake"></label>
      <label class="field">Pahar<select id="f-glass">${opt("","Nespecificat",r.glass||"")}${opt("glob","Glob",r.glass)}${opt("jar","Borcănaș",r.glass)}${opt("both","Glob sau borcănaș",r.glass)}</select></label>
      <label class="check" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="f-zero"${r.zero?" checked":""}> Fără alcool (0%)</label>
    </div>
    <fieldset class="fset"><legend>Ingrediente</legend>
      <p class="hint">„Top”, „stropi” și „după gust” nu au cantitate.</p>
      <div id="f-ing">${r.ing.map(ingRow).join("")}</div>
      <button class="add" type="button" data-act="add-ing">Adaugă ingredient</button></fieldset>
    <fieldset class="fset"><legend>Pași de preparare</legend>
      <p class="hint">Scrie „Muddle: …” ca prima parte să apară îngroșată.</p>
      <div id="f-steps">${r.steps.map(s=>txtRow(s,"Pas")).join("")}</div>
      <button class="add" type="button" data-act="add-step">Adaugă pas</button></fieldset>
    <fieldset class="fset"><legend>Pe meniul clienților</legend>
      <p class="hint">Apare pe site, în portalul clientului și pe pagina de la bar.</p>
      <div class="fgrid">
        <label class="field">Secțiune<select id="f-sec">${(sv=>opt("","Nu apare pe meniu",sv)+opt("sig","Signature",sv)+opt("cls","Classics",sv)+opt("zero","Fără alcool",sv))(r.sec??(r.zero?"zero":"cls"))}</select></label>
        <label class="field">Gust<input type="text" id="f-gust" value="${esc(r.gust||"")}" placeholder="ex. floral · fructat"></label>
      </div>
      <label class="field">Ingrediente pe meniu<input type="text" id="f-ingm" value="${esc(r.ingM||"")}" placeholder="ex. gin, lychee, lămâie, sirop de soc"></label>
      <label class="field">Descriere scurtă<input type="text" id="f-desc" value="${esc(r.desc||"")}" placeholder="ex. Flori de soc și lychee, ușor acrișor."></label></fieldset>
    <fieldset class="fset"><legend>Garnish</legend>
      <div id="f-gar">${r.garnish.map(g=>txtRow(g,"Garnish")).join("")}</div>
      <button class="add" type="button" data-act="add-gar">Adaugă garnish</button></fieldset>

/* Consumul unui eveniment, pe articol: trimis minus retur (sau tot ce s-a trimis, dacă nu s-a notat returul) */
function eventConsumption(e){
  const out=[];
  D.items.forEach(it=>{const x=e.values[it.key];if(!x||typeof x.v!=="number"||!(x.v>0))return;
    const rv=QTY_CATS.includes(it.cat)?retVal(e.id,it.key):null;
    out.push({k:cxKey(it.excelLabel),label:it.label,cat:it.cat,note:x.note||"",sent:x.v,ret:rv,cons:Math.max(0,rv==null?x.v:x.v-rv)})});
  /* luat în plus (fără cantitate în fișă): consum = luat minus întors */
  const X=typeof retExtra==="function"?retExtra(e.id):{};
  D.items.forEach(it=>{const xe=X[it.key];if(!xe||typeof xe.luat!=="number"||!(xe.luat>0))return;const x=e.values[it.key];if(x&&typeof x.v==="number"&&x.v>0)return;
    const rv=typeof xe.retur==="number"?xe.retur:0;
    out.push({k:cxKey(it.excelLabel),label:it.label,cat:it.cat,note:"",sent:xe.luat,ret:rv,plus:true,cons:Math.max(0,xe.luat-rv)})});
  return out;
}

}

LISTA DE STOC (cod | denumire):

function parseJSON(t){
  t=String(t||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");
  const i=t.indexOf("{"),j=t.lastIndexOf("}");if(i<0||j<i)throw new Error("json");
  return JSON.parse(t.slice(i,j+1));
}
function aiErr(e){
  const m=String(e&&(e.message||e.code)||e).replace(/https?:\/\/\S+/g," ");
  if(/billing|API has not been used|disabled|SERVICE_DISABLED|not enabled/i.test(m))return "Serviciul Gemini nu e activat în proiectul Firebase (AI Logic → Get started).";
  if(/app.?check|appcheck|recaptcha|403|permission/i.test(m))return "Google a refuzat cererea: protecția App Check nu e încă activă. Verifică pașii de configurare din Firebase.";
  if(/\b429\b|quota|exhausted|rate.?limit/i.test(m))return "S-a atins limita gratuită de citiri pentru moment. Încearcă peste câteva minute sau mâine.";
  if(/failed to fetch|network|import|load failed|dynamically imported/i.test(m))return "Nu m-am putut conecta la serviciul de citire. Verifică internetul și încearcă din nou.";
  if(/blocked|safety|SAFETY|recitation/i.test(m))return "Google a refuzat să descrie poza (filtrul lor de siguranță). Încearcă altă poză.";
  if(/json/i.test(m))return "Nu am înțeles răspunsul. Încearcă o poză mai clară, dreaptă și bine luminată.";
  return "Citirea facturii nu a reușit. Încearcă din nou sau completează manual.";
}

function retFor(d){

const isoToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
/* O ieșire e „planificată” până în ziua primului eveniment din săptămâna ei: marfa e rezervată, nu scoasă încă din depozit */
const isPlanned=d=>d.tip==="iesire"&&d.when&&d.when>isoToday();
function totals(skipDs){
  const t={};const g=k=>t[k]=t[k]||{in:0,out:0,ret:0,adj:0,plan:0};
  Object.values(docs).forEach(d=>{
    const it=d.items||{};
    if(d.tip==="factura")Object.entries(it).forEach(([k,v])=>g(k).in+=v);
    else if(d.tip==="corectie")Object.entries(it).forEach(([k,v])=>g(k).adj+=v);
    else if(d.tip==="iesire"){if(skipDs&&d.ds===skipDs)return;
      if(isPlanned(d))Object.entries(it).forEach(([k,v])=>g(k).plan+=v);
      else{Object.entries(it).forEach(([k,v])=>g(k).out+=v);Object.entries(extraOut(d)).forEach(([k,v])=>g(k).out+=v);Object.entries(retFor(d)).forEach(([k,v])=>g(k).ret+=v)}}
  });
  Object.values(t).forEach(x=>{x.stoc=x.in+x.adj-x.out+x.ret;x.disp=x.stoc-x.plan});

  const val=i=>i>=0&&lines[i+1]&&/^[A-ZĂÂÎȘȚŞŢ\- ]{2,}$/.test(lines[i+1].toUpperCase())?up(lines[i+1]):"";
  if(val(iN)&&val(iP))out.nume=`${val(iN)} ${val(iP)}`;
  const iD=lab(/domiciliu|adresse|address/i);
  if(iD>=0){const a=lines.slice(iD+1,iD+3).join(" ");
    const loc=a.match(/(?:mun\.?|or\.?|ora[sș]\.?|com\.?|sat)\s*([A-Za-zĂÂÎȘȚăâîșțşţ\- ]+?)\s*\(?\s*\(([A-Z]{1,2})\)/i)||a.match(/([A-Za-zĂÂÎȘȚăâîșțşţ\- ]+?)\s*\(([A-Z]{1,2})\)/);

    if(st){out.strada=st[1].replace(/\s+/g," ").trim();out.nr=st[2]}
    const g=(re)=>{const m=a.match(re);return m?m[1]:""};

  const {aiM,ai}=await X.loadAI();let res,last;

    catch(e){last=e;if(!/not.?found|404|unsupported|is not available|invalid.*model/i.test(String(e&&e.message)))throw e}}

/* încărcare „resumable”: merge și pentru clipuri mari, cu bară de progres */
async function ttUpload(file,name,parent){
  const tok=await gToken(),type=file.type||"video/mp4";
  const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size",{method:"POST",
    headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":type},body:JSON.stringify({name,mimeType:type,parents:[parent]})});
  if(r.status===401){G.tok=null;throw {msg:"Sesiunea Google a expirat. Apasă din nou."}}
  const loc=r.ok&&r.headers.get("Location");if(!loc)throw {msg:`Google nu a pornit încărcarea (${r.status}).`};
  return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open("PUT",loc);x.setRequestHeader("Content-Type",type);
    x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.min(99,Math.floor(e.loaded/e.total*100));if(p!==VID.pct){VID.pct=p;const b=PV.querySelector('[data-c="vidpost"]'),bar=PV.querySelector(".vid-bar i");if(b)b.textContent=vidBtnTxt();if(bar)bar.style.width=p+"%"}}};
    x.onload=()=>{if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText))}catch(e){rej({msg:"Răspuns neașteptat de la Google Drive."})}}else rej({msg:`Încărcarea în Drive nu a reușit (${x.status}).`})};
    x.onerror=()=>rej({msg:"Încărcarea s-a întrerupt. Verifică internetul și încearcă din nou."});x.send(file)})}

     ["caption",txt],["title",first.slice(0,90)],["platforms",VID.reel?"tiktok,instagram":"tiktok"],["mode",VID.when==="now"?"now":"queue"],["size",String(VID.file.size)]].forEach(([k,v])=>fd.append(k,v));
    const r=await fetch(hook,{method:"POST",body:fd});if(!r.ok)throw {msg:`Make nu a primit clipul (${r.status}). Verifică dacă scenariul „Postare TikTok” e pornit. Clipul e deja în Drive.`};
    const item={at:new Date().toISOString(),fileId:up.id,name,caption:txt,when:VID.when,reel:VID.reel};

const nr=v=>{const n=Number(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};
const lei=v=>`${Math.round(v).toLocaleString("ro-RO")} lei`;
const pct=v=>`${Math.round((v||0)*100)}%`;
const TVA=0.21;
function rentDefaults(c){const r=c.rent||{};return {invitati:r.invitati??(c.invitati||""),curs:r.curs??"5",barmani:r.barmani??"",tarif:r.tarif??"",transport:r.transport??"",alte:r.alte??"",
  bauturaClient:r.bauturaClient??(c.unitate==="TOTAL"),costBautura:r.costBautura??"",consum:r.consum||null}}
function rentCalc(c,r){
  const curs=c.moneda==="EURO"?nr(r.curs)||0:1,brut=(c.unitate==="TOTAL"?nr(c.pret):nr(c.pret)*nr(r.invitati))*curs;
  const venit=c.tva==="cu TVA inclus"?brut/(1+TVA):brut;
  const bautura=r.bauturaClient?0:nr(r.costBautura),personal=nr(r.barmani)*nr(r.tarif),transport=nr(r.transport),alte=nr(r.alte);
  const cost=bautura+personal+transport+alte,profit=venit-cost;
  return {venit,bautura,personal,transport,alte,cost,profit,marja:venit?profit/venit:0};
}

const G_ERR={popup_failed_to_open:"Fereastra Google nu s-a putut deschide.",popup_closed:"Fereastra Google s-a închis înainte de final.",unknown:"Google nu a terminat conectarea."};
/* clientul Google se creează o singură dată, din timp; la apăsare doar cerem tokenul (recomandarea Google) */
function gInit(oa){if(G.tc)return G.tc;const cid=gCid();if(!cid)return null;
  G.tc=oa.initTokenClient({client_id:cid,scope:"https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar.events",hint:"cocktailphilosophy@gmail.com",
    callback:r=>{const w=G.w;G.w=null;if(!w)return;if(r&&r.access_token){G.tok=r.access_token;G.exp=Date.now()+(+r.expires_in||3600)*1000;G.err=null;w.res(G.tok)}else{G.err=(r&&r.error)||"refuz";w.rej({msg:`Google a refuzat conectarea (${G.err}). Apasă „Conectează Google” și alege contul cocktailphilosophy@gmail.com.`})}},
    error_callback:e=>{const w=G.w;G.w=null;const t=(e&&e.type)||"unknown";console.warn("GIS",e);G.err=t;G.errAt=Date.now();try{render()}catch(x){}if(w)w.rej({msg:`${G_ERR[t]||G_ERR.unknown} (cod: ${t}). Apasă butonul verde „Conectează Google” de sus.`})}});
  return G.tc}
function gPrep(){const cid=gCid();if(!cid)return Promise.resolve(null);if(G.oa){gInit(G.oa);return Promise.resolve(G.oa)}return loadGIS().then(oa=>{G.oa=oa;gInit(oa);return oa}).catch(()=>null)}
function gAsk(){const tc=gInit(G.oa);if(!tc)return Promise.reject({msg:"Lipsește Google Client ID."});
  return new Promise((res,rej)=>{G.w={res,rej};try{tc.requestAccessToken({prompt:G.tok?"":"consent"})}catch(e){G.w=null;rej({msg:"Conectarea Google nu a pornit. Reîncarcă pagina și încearcă din nou."})}})}
function gToken(){
  if(G.tok&&Date.now()<G.exp-60000)return Promise.resolve(G.tok);
  const cid=gCid();
  if(!cid)return Promise.reject({msg:"Lipsește Google Client ID. Completează-l la „Datele firmei” → Google Drive și Calendar."});
  if(G.pend)return G.pend;
  if(G.errAt&&Date.now()-G.errAt<3000)return Promise.reject({msg:"Google nu e conectat. Apasă butonul verde „Conectează Google” de sus."});
  if(G.oa){G.pend=gAsk().finally(()=>{G.pend=null});return G.pend}   // sincron, în aceeași apăsare
  return loadGIS().then(oa=>{G.oa=oa;return gAsk()}).catch(e=>{throw e&&e.msg?e:{msg:"Nu s-a încărcat conectarea Google. Verifică internetul."}});
}
function gConnHTML(){return G.err&&!(G.tok&&Date.now()<G.exp-60000)?`<div class="ev-alert"><b>Google nu e conectat</b> <small class="ev-file">(cod: ${esc(G.err)})</small><div class="qr-la" style="margin-top:8px"><button class="btn primary" data-gconn="1">Conectează Google</button></div><p class="ev-file">Se deschide o fereastră Google: alege cocktailphilosophy@gmail.com și apasă Continuă. După aceea apasă din nou butonul de Drive.</p></div>`:""}
async function gf(url,o={}){
  const t=await gToken();const r=await fetch(url,{...o,headers:{Authorization:"Bearer "+t,...(o.headers||{})}});
  if(r.status===401){G.tok=null;throw {msg:"Sesiunea Google a expirat. Apasă din nou."}}
  if(!r.ok){let m="";try{m=(await r.json()).error.message}catch(e){}throw {msg:`Google a refuzat operația (${r.status}). ${m}`}}
  return r.status===204?null:r.json();
}
const DQ=q=>gf("https://www.googleapis.com/drive/v3/files?fields=files(id,name)&pageSize=10&q="+encodeURIComponent(q));
async function folderFor(year){
  const fq=(n,p)=>`name='${n}' and mimeType='application/vnd.google-apps.folder' and trashed=false`+(p?` and '${p}' in parents`:" and 'root' in parents");
  const mk=(n,p)=>gf("https://www.googleapis.com/drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,mimeType:"application/vnd.google-apps.folder",...(p?{parents:[p]}:{})})});
  let root=(await DQ(fq("Evenimente"))).files[0];if(!root)root=await mk("Evenimente");
  const yn=`Evenimente ${year}`;let y=(await DQ(fq(yn,root.id))).files[0];if(!y)y=await mk(yn,root.id);return y.id;
}
function pdfBlob(c){return loadPdfMake().then(pm=>new Promise(res=>pm.createPdf(contractDoc(c,firma||FIRMA_DEF)).getBlob(res)))}
async function uploadPdf(c,blob){
  const name=fileName(c),meta={name,mimeType:"application/pdf"};
  if(c.driveId){
    try{return await gf(`https://www.googleapis.com/upload/drive/v3/files/${c.driveId}?uploadType=multipart&fields=id,name,webViewLink`,{method:"PATCH",body:mp({name},blob)})}
    catch(e){if(!/404/.test(e.msg||""))throw e}
  }
  meta.parents=[await folderFor(c.dataEv.slice(0,4))];
  return gf("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink",{method:"POST",body:mp(meta,blob)});
}
function mp(meta,blob){const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));fd.append("file",blob);return fd}
const calId=()=>encodeURIComponent((firma&&firma.gCal)||"cocktailphilosophy@gmail.com");
const CAL=p=>`https://www.googleapis.com/calendar/v3/calendars/${calId()}/events${p||""}`;
function dayISO(d,add){const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+(add||0));return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`}
function evTimes(c){
  if(!c.oraEv)return {start:{date:c.dataEv},end:{date:dayISO(c.dataEv,1)}};
  const [h,m]=c.oraEv.split(":").map(Number),e=`${String((h+1)%24).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  return {start:{dateTime:`${c.dataEv}T${c.oraEv}:00`,timeZone:"Europe/Bucharest"},end:{dateTime:`${c.dataEv}T${e}:00`,timeZone:"Europe/Bucharest"}};
}
async function dayEvents(d){
  const tz=new Date(d+"T00:00:00").getTimezoneOffset(),off=(tz>0?"-":"+")+String(Math.abs(tz/60)|0).padStart(2,"0")+":00";
  const r=await gf(CAL(`?singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(d+"T00:00:00"+off)}&timeMax=${encodeURIComponent(dayISO(d,1)+"T00:00:00"+off)}`));
  return (r.items||[]).filter(e=>e.status!=="cancelled");
}
async function writeEvent(c,file,targetId){
  const sg=c.signedId?{fileUrl:`https://drive.google.com/file/d/${c.signedId}/view?usp=drivesdk`,fileId:c.signedId,title:c.signedName||"Contract semnat",mimeType:c.signedMime||"application/pdf"}:null;
  const att=sg||{fileUrl:`https://drive.google.com/file/d/${file.id}/view?usp=drivesdk`,fileId:file.id,title:file.name,mimeType:"application/pdf"};
  const desc=evDesc(c);
  if(targetId){
    const ex=await gf(CAL("/"+encodeURIComponent(targetId)));
    const old=String(ex.description||"").trim(),keep=old&&!old.includes(MARK)?"\n\n— Note anterioare —\n"+old:"";
    const atts=(ex.attachments||[]).filter(a=>a.fileId!==file.id&&a.fileId!==att.fileId&&!(c.driveId&&a.fileId===c.driveId));atts.push(att);
    const body={description:desc+keep,location:ex.location||tcase(c.locatie),attachments:atts};
    if(c.oraEv)Object.assign(body,evTimes(c));
    return gf(CAL("/"+encodeURIComponent(targetId)+"?supportsAttachments=true&sendUpdates=none"),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  }
  const sum=[tcase(c.locatie),String(c.invitati||"").trim(),surname(c.nume)].filter(Boolean).join(" ");
  return gf(CAL("?supportsAttachments=true&sendUpdates=none"),{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({summary:sum,location:tcase(c.locatie),description:desc,attachments:[att],...evTimes(c)})});
}

    <button class="btn" data-gp="__new">Eveniment nou</button><button class="btn" data-gp="__cancel">Renunță</button></div></div>`;

async function gsync(c,btn,target){
  const lbl=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent="Se salvează în Google…"}
  try{
    if(!c.dataEv)throw {msg:"Completează data evenimentului."};
    let tgt=target;
    if(tgt===undefined){
      if(c.calId){try{const ex=await gf(CAL("/"+encodeURIComponent(c.calId)));if(ex&&ex.status!=="cancelled")tgt=c.calId}catch(e){}}
      if(tgt===undefined){const items=await dayEvents(c.dataEv);
        if(items.length){G.pick={c,items};render();const el=$("#gPick");if(el)el.scrollIntoView({block:"center"});return}
        tgt=null}
    }
    const blob=await pdfBlob(c),file=await uploadPdf(c,blob),ev=await writeEvent(c,file,tgt||null);
    await F.fs.doc(`${F.base}/contracte/${c.id}`).set({driveId:file.id,calId:ev.id},{merge:true});
    if(f&&f.id===c.id){f.driveId=file.id;f.calId=ev.id}
    G.pick=null;toast(`Gata: contractul e în Drive (${file.name}) și ${tgt?"evenimentul a fost completat":"evenimentul a fost creat"} în calendar.`);
    if(mode==="form"){mode="list";f=null}render();
  }catch(e){console.warn(e);toast(e&&e.msg||"Nu am putut salva în Google. Încearcă din nou.")}
  finally{if(btn&&document.contains(btn)){btn.disabled=false;btn.textContent=lbl}}
}

async function uploadSigned(c,fileIn){
  const lab=fileIn.closest("label");if(lab){lab.classList.add("busy");lab.firstChild.textContent="Se încarcă în Drive…"}
  try{
    if(!c.dataEv)throw {msg:"Contractul nu are data evenimentului. Completeaz-o la Editează."};
    if(fileIn.files[0].size>25e6)throw {msg:"Fișierul e prea mare (peste 25 MB)."};
    const fl=fileIn.files[0],ext=(fl.name.match(/\.[a-z0-9]{2,5}$/i)||[fl.type==="application/pdf"?".pdf":".jpg"])[0].toLowerCase(),
      name=fileName(c).replace(/_Contract\.pdf$/,"_Contract_SEMNAT"+ext),mime=fl.type||"application/pdf";
    let file=null;
    if(c.signedId){try{file=await gf(`https://www.googleapis.com/upload/drive/v3/files/${c.signedId}?uploadType=multipart&fields=id,name`,{method:"PATCH",body:mp({name,mimeType:mime},fl)})}catch(e){if(!/404/.test(e.msg||""))throw e}}
    if(!file)file=await gf("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",{method:"POST",body:mp({name,mimeType:mime,parents:[await folderFor(c.dataEv.slice(0,4))]},fl)});
    const upd={signedId:file.id,signedName:file.name,signedMime:mime,signedAt:today()};
    await F.fs.doc(`${F.base}/contracte/${c.id}`).set(upd,{merge:true});
    const cc={...c,...upd};let calMsg="";
    if(c.calId){try{const ex=await gf(CAL("/"+encodeURIComponent(c.calId)));
        if(ex&&ex.status!=="cancelled"){
          const old=String(ex.description||""),desc=old.includes(MARK)?evDesc(cc)+(old.includes("— Note anterioare —")?"\n\n— Note anterioare —"+old.split("— Note anterioare —").slice(1).join("— Note anterioare —"):""):old;
          const atts=(ex.attachments||[]).filter(a=>a.fileId!==file.id&&a.fileId!==c.driveId);
          atts.push({fileUrl:`https://drive.google.com/file/d/${file.id}/view?usp=drivesdk`,fileId:file.id,title:file.name,mimeType:mime});
          await gf(CAL("/"+encodeURIComponent(c.calId)+"?supportsAttachments=true&sendUpdates=none"),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({description:desc,attachments:atts})});
          calMsg=" și l-am pus în calendar în locul celui nesemnat"}}catch(e){console.warn(e);calMsg=", dar nu am putut actualiza calendarul"}}
    else calMsg=". Apasă „Drive + calendar” ca să apară și în calendar";
    toast(`Gata: contractul semnat e în Drive (${file.name})${calMsg}.`);
  }catch(e){console.warn(e);toast(e&&e.msg||"Nu am putut încărca contractul semnat. Încearcă din nou.")}
  finally{fileIn.value="";render()}
}

async function bkCollect(){
  const out={app:"Cocktail Philosophy",at:new Date().toISOString(),base:F.base,docs:{}};

const pd=s=>{const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};

const telWa=t=>{let d=String(t||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="4"+d;return d};
const toast=m=>{const t=document.getElementById("toast");if(!t)return;t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3500)};
const dsKey=f=>"d-"+String(f).replace(/[^A-Za-z0-9_\-.~:@+]/g,"-").slice(0,150);

let ALL={},sub=null,TEL=null,started=false,view="mine";
const me=()=>({uid:F.UID,name:F.NAME||""});
const my=()=>ALL[F.UID]||{days:{},conf:{}};
function subscribe(){if(sub)return;sub=F.fs.collection(`${F.base}/disp`).onSnapshot(s=>{const n={};s.docs.forEach(d=>n[d.id]=d.data());ALL=n;render();banner();document.dispatchEvent(new Event("cp-disp"))},()=>{V.innerHTML=`<p class="notice">Disponibilitatea nu se poate încărca. ${F.isAdmin?"Verifică regulile din Firebase (disp).":"Verifică internetul."}</p>`})}
const save=part=>F.fs.doc(`${F.base}/disp/${F.UID}`).set({name:F.NAME||"",...part,at:new Date().toISOString()},{merge:true}).catch(()=>toast("Nu am putut salva. Verifică internetul."));

/* evenimentele săptămânii încărcate și cine e în echipă */
function weekEvents(){try{const e=window.__cp.evd();if(!e||!e.aoa)return {D:null,ds:""};return {D:window.__cp.parseAOA(e.aoa,e.fileName),ds:dsKey(e.fileName)}}catch(x){return {D:null,ds:""}}}
function evISO(e,D){const d=e.date||(D&&D.title&&D.title.date);return d?iso(d):""}
function mine(){const {D,ds}=weekEvents();if(!D)return [];const f=first(F.NAME);if(!f)return [];
  return D.events.filter(e=>(e.team||[]).some(n=>first(n)===f)).map(e=>({e,ds,key:`${ds}|${e.col}`,d:evISO(e,D)}))}
/* cine a marcat că poate / nu poate într-o zi */
function availFor(d){const ok=[],no=[];Object.values(ALL).forEach(x=>{const v=x.days&&x.days[d];if(v==="da")ok.push(x.name);else if(v==="nu")no.push(x.name)});return {ok:ok.sort(),no:no.sort()}}
function confOf(name,key){const f=first(name);const x=Object.values(ALL).find(y=>first(y.name)===f);return x&&x.conf?x.conf[key]:null}

/* ---------- banner pentru barmani: „Ești în echipă la…” ---------- */
function banner(){
  const B=document.getElementById("dispBanner");if(!B)return;if(F.isAdmin){B.innerHTML="";return}
  const L=mine().filter(x=>!x.d||x.d>=iso(new Date())),c=my().conf||{},todo=L.filter(x=>!c[x.key]);
  if(!todo.length){B.innerHTML="";return}
  B.innerHTML=`<div class="ev-alert disp-ban"><b>Ești în echipă ${todo.length===1?"la un eveniment":"la "+todo.length+" evenimente"}:</b>`+todo.map(x=>`<div class="disp-r"><span>${esc(x.e.name)}${x.d?" · "+esc(fday(x.d)):""}${x.e.time?" · ora "+esc(x.e.time):""}</span><span class="qr-la"><button class="btn primary" data-dc="da" data-k="${esc(x.key)}">Confirm</button><button class="btn" data-dc="nu" data-k="${esc(x.key)}">Nu pot</button></span></div>`).join("")+`</div>`;
}

  const conf={...(my().conf||{}),[k]:v};ALL[F.UID]={...my(),conf};await save({conf:{[k]:v}});banner();render();toast(v==="da"?"Mulțumim! Paul vede că ai confirmat.":"Am anunțat că nu poți.")});

/* calendar lună cu lună, de azi până la 31 decembrie 2027 */
const CAL_END=new Date(2027,11,31);let calM=null,admM=null;
const MONC=m=>MONL[m][0].toUpperCase()+MONL[m].slice(1);
function calHTML(){
  const today=new Date();today.setHours(0,0,0,0);const m0=new Date(today.getFullYear(),today.getMonth(),1);
  if(!calM||calM<m0)calM=new Date(m0);const mEnd=new Date(CAL_END.getFullYear(),CAL_END.getMonth(),1);if(calM>mEnd)calM=new Date(mEnd);
  const y=calM.getFullYear(),mo=calM.getMonth(),n=new Date(y,mo+1,0).getDate(),lead=(new Date(y,mo,1).getDay()+6)%7;
  const days=my().days||{},{D}=weekEvents(),evd=new Set(D?D.events.map(e=>evISO(e,D)).filter(Boolean):[]);
  let cOk=0,cNo=0;Object.entries(days).forEach(([k,v])=>{if(k.startsWith(`${y}-${String(mo+1).padStart(2,"0")}`)){if(v==="da")cOk++;else if(v==="nu")cNo++}});
  let h=`<div class="disp-cal"><div class="disp-nav"><button class="btn" data-dm="-1" ${calM<=m0?"disabled":""} aria-label="Luna anterioară">‹</button><b>${MONC(mo)} ${y}</b><button class="btn" data-dm="1" ${calM>=mEnd?"disabled":""} aria-label="Luna următoare">›</button></div>
  <p class="ev-file disp-sum">${cOk||cNo?`✓ ${cOk} ${cOk===1?"zi":"zile"} pot · ✕ ${cNo} nu pot`:"Nicio zi marcată în luna asta."}</p>
  <div class="disp-h">${["Lun","Mar","Mie","Joi","Vin","Sâm","Dum"].map(x=>`<span>${x}</span>`).join("")}</div><div class="disp-g">`;
  for(let i=0;i<lead;i++)h+=`<span></span>`;
  for(let dn=1;dn<=n;dn++){const d=new Date(y,mo,dn),k=iso(d),past=d<today,v=days[k];
    h+=`<button class="disp-d ${v==="da"?"ok":v==="nu"?"no":""} ${past?"past":""} ${evd.has(k)?"ev":""}" data-dd="${k}" ${past?"disabled":""} aria-label="${esc(fday(k))}: ${v==="da"?"pot":v==="nu"?"nu pot":"nemarcat"}"><b>${dn}</b><i>${v==="da"?"✓":v==="nu"?"✕":""}</i></button>`}
  return h+`</div><div class="qr-la disp-quick"><button class="btn" data-dq="we">✓ Toate weekendurile lunii</button><button class="btn" data-dq="clr">Golește luna</button></div>
  <p class="ev-file">Atinge o zi: o dată = <b>✓ pot</b>, a doua oară = <b>✕ nu pot</b>, a treia oară o golești. Cu ‹ › mergi lună cu lună, până în decembrie 2027. Paul vede zilele tale când face echipa.</p></div>`}
async function saveDays(days){ALL[F.UID]={...my(),days};render();
  await F.fs.doc(`${F.base}/disp/${F.UID}`).set({name:F.NAME||"",days,conf:my().conf||{},at:new Date().toISOString()}).catch(()=>toast("Nu am putut salva."))}
function render(){

  let h=`<div class="st-top"><div><p class="ev-sub">${F.isAdmin?"Echipa":"Salut, "+esc(F.NAME||"")+"!"}</p><p class="ev-file">${F.isAdmin?"Cine poate lucra și cine a confirmat evenimentele.":"Evenimentele la care ești în echipă și zilele în care poți lucra."}</p></div>`;

  else if(F.isAdmin&&view==="team")h+=teamHTML();
  else{const L=mine().filter(x=>!x.d||x.d>=iso(new Date()));h+=`<h2 class="ev-h2">Evenimentele mele</h2>`;
    if(!L.length)h+=`<div class="ev-ok">Nu ești în echipă la evenimentele din săptămâna încărcată.</div>`;
    else{const c=my().conf||{};h+=`<div class="ev-list">`+L.map(x=>`<div class="disp-r"><span><b>${esc(x.e.name)}</b><small>${x.d?esc(fday(x.d)):""}${x.e.time?" · ora "+esc(x.e.time):""}${x.e.persons?" · "+x.e.persons+" persoane":""} · echipa: ${esc((x.e.team||[]).join(", "))}</small></span><span class="qr-la">${c[x.key]==="da"?`<span class="ct-chip on">✓ confirmat</span>`:c[x.key]==="nu"?`<span class="ct-chip">✕ nu pot</span>`:""}<button class="btn${c[x.key]==="da"?"":" primary"}" data-dc="da" data-k="${esc(x.key)}">Confirm</button><button class="btn" data-dc="nu" data-k="${esc(x.key)}">Nu pot</button></span></div>`).join("")+`</div>`}
    h+=`<h2 class="ev-h2">Când pot lucra</h2>`+calHTML();}

/* ---------- feedback de la invitați (QR-ul de pe bar) ---------- */
let FB=null,fbSub=null,fbEv="",fbDel=null;
function fbSubscribe(){if(fbSub)return;fbSub=F.fs.collection("barFeedback").onSnapshot(s=>{FB=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>String(b.at).localeCompare(String(a.at)));render()},()=>{FB="err";render()})}
const fbSeenK="cp-fb-seen";
function fbNew(){if(!Array.isArray(FB))return 0;let t="";try{t=localStorage.getItem(fbSeenK)||""}catch(e){}return FB.filter(x=>String(x.at)>t).length}
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const avg=L=>L.length?(L.reduce((a,x)=>a+(+x.r||0),0)/L.length):0;
const ld=a=>{const d=new Date(a);return isNaN(d)?String(a||"").slice(0,10):iso(d)},lt=a=>{const d=new Date(a);return isNaN(d)?"":`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
function fbGroup(x){const d=ld(x.at);return `${d}|${x.evn||(x.ev&&x.ev!=="general"?x.ev:"QR general")}`}
function fbHTML(){
  if(FB==="err")return `<div class="ev-alert">Feedbackul nu se poate încărca. Dacă ești barman: intră o dată în aplicație cu linkul echipei, apoi reîncarcă. Paul: verifică regulile Firestore (blocul barFeedback).</div>`;
  if(!FB)return `<p class="ev-file">Se încarcă feedbackul…</p>`;
  try{localStorage.setItem(fbSeenK,FB.length?String(FB[0].at):"")}catch(e){}
  if(!FB.length)return `<div class="ev-ok">Încă nu a lăsat nimeni feedback. Invitații îl dau din pagina care se deschide când scanează QR-ul de pe bar (secțiunea „Cum ți se pare?”).</div>`;
  const G={};FB.forEach(x=>{const k=fbGroup(x);(G[k]=G[k]||[]).push(x)});
  const keys=Object.keys(G).sort().reverse();if(fbEv&&!G[fbEv])fbEv="";
  const L=fbEv?G[fbEv]:FB,a=avg(L),ck={};L.forEach(x=>{if(x.ck)ck[x.ck]=(ck[x.ck]||0)+1});
  const top=Object.entries(ck).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const dist=[5,4,3,2,1].map(n=>{const c=L.filter(x=>+x.r===n).length;return `<div class="fb-bar"><span>${n}★</span><i style="--w:${L.length?Math.round(c/L.length*100):0}%"></i><b>${c}</b></div>`}).join("");
  const lab=k=>{const [d,n]=k.split("|");return `${n} · ${fday(d)}`};
  let h=`<div class="fb-sum"><div class="fb-avg"><b>${a.toFixed(1)}</b><span class="fb-st">${stars(Math.round(a))}</span><small>${L.length} ${L.length===1?"părere":"păreri"}</small></div><div class="fb-dist">${dist}</div></div>`;
  if(top.length)h+=`<p class="ev-file">Cocktailul preferat: ${top.map(([n,c])=>`<b>${esc(n)}</b> (${c})`).join(" · ")}</p>`;
  h+=`<label class="fb-sel">Eveniment<select data-fbev><option value="">Toate (${FB.length})</option>${keys.map(k=>`<option value="${esc(k)}"${k===fbEv?" selected":""}>${esc(lab(k))} · ${G[k].length} · ${avg(G[k]).toFixed(1)}★</option>`).join("")}</select></label>`;
  h+=`<div class="ev-list">`+L.slice(0,150).map(x=>`<div class="fb-item ${+x.r<=2?"low":""}"><div class="fb-h"><span class="fb-st">${stars(+x.r||0)}</span><small>${esc(x.nm||"anonim")} · ${esc(fbEv?"":(x.evn||"QR general")+" · ")}${esc(fday(ld(x.at)))} ${esc(lt(x.at))}</small></div>${x.ck?`<p class="fb-ck">🍹 ${esc(x.ck)}</p>`:""}${x.msg?`<p class="fb-m">„${esc(x.msg)}”</p>`:""}${F.isAdmin?`<button class="btn fb-del" data-fbdel="${esc(x.id)}">${fbDel===x.id?"Sigur ștergi?":"Șterge"}</button>`:""}</div>`).join("")+`</div>`;
  return h+`<p class="ev-file">Feedbackul îl văd doar Paul și echipa, în aplicație. Invitații care dau 4–5 stele sunt rugați să lase și o recenzie pe Google.</p>`;
}
function teamHTML(){
  const {D,ds}=weekEvents();let h="";
  if(D&&D.events.length){h+=`<h2 class="ev-h2">Echipa săptămânii · ${esc(D.title.big)}</h2><div class="ev-list">`;
    D.events.forEach(e=>{const key=`${ds}|${e.col}`,d=evISO(e,D),T=e.team||[];
      h+=`<div class="disp-r disp-ev"><span><b>${esc(e.name)}</b><small>${d?esc(fday(d)):""}${e.time?" · ora "+esc(e.time):""}</small></span><span class="disp-ppl">${T.length?T.map(n=>{const c=confOf(n,key),tel=TEL&&TEL[first(n)];
        const txt=`Salut, ${n}! Te-am pus în echipă la ${e.name}${d?", "+fday(d):""}${e.time?", ora "+e.time:""}. Confirmă în aplicație (tab-ul Echipa) sau răspunde-mi aici. Mulțumesc!`;
        return `<span class="disp-p ${c==="da"?"ok":c==="nu"?"no":""}">${esc(n)} ${c==="da"?"✓":c==="nu"?"✕":"·"}${tel?` <a href="https://wa.me/${telWa(tel)}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener" title="Anunță pe WhatsApp">💬</a>`:""}</span>`}).join(""):`<small class="ev-file">fără echipă în fișă</small>`}</span></div>`});
    h+=`</div><p class="ev-file">✓ a confirmat în aplicație · ✕ nu poate · punct = încă nu a răspuns. 💬 trimite mesajul pe WhatsApp (telefoanele le pui la Raport → Tarife și telefoane). Barmanii văd evenimentele lor în aplicație, în tab-ul Echipa, imediat ce salvezi fișa.</p>`}
  const today=iso(new Date()),dates=new Set();Object.values(ALL).forEach(x=>Object.keys(x.days||{}).forEach(k=>{if(k>=today)dates.add(k)}));
  if(D)D.events.forEach(e=>{const d=evISO(e,D);if(d>=today)dates.add(d)});
  const t0=new Date();t0.setHours(0,0,0,0);const m0=new Date(t0.getFullYear(),t0.getMonth(),1),mEnd=new Date(CAL_END.getFullYear(),CAL_END.getMonth(),1);
  if(!admM||admM<m0)admM=new Date(m0);if(admM>mEnd)admM=new Date(mEnd);const pre=`${admM.getFullYear()}-${String(admM.getMonth()+1).padStart(2,"0")}`;
  h+=`<h2 class="ev-h2">Cine poate lucra</h2><div class="disp-nav"><button class="btn" data-am="-1" ${admM<=m0?"disabled":""} aria-label="Luna anterioară">‹</button><b>${MONC(admM.getMonth())} ${admM.getFullYear()}</b><button class="btn" data-am="1" ${admM>=mEnd?"disabled":""} aria-label="Luna următoare">›</button></div>`;
  const L=[...dates].filter(d=>d.startsWith(pre)).sort();
  if(!L.length)h+=`<div class="ev-ok">Nimeni nu și-a marcat zile în luna asta. Spune-le barmanilor să intre în aplicație, la tab-ul Echipa.</div>`;
  else h+=`<div class="rp-t">`+L.map(d=>{const a=availFor(d);return `<div class="disp-av"><span><b>${esc(fday(d))}</b></span><span>${a.ok.length?`<span class="disp-ok">✓ ${a.ok.map(esc).join(", ")}</span>`:""}${a.no.length?` <span class="disp-no">✕ ${a.no.map(esc).join(", ")}</span>`:""}${!a.ok.length&&!a.no.length?`<small class="ev-file">nimeni nu a marcat</small>`:""}</span></div>`}).join("")+`</div>`;
  const who=Object.values(ALL).map(x=>x.name).filter(Boolean).sort();
  if(who.length)h+=`<p class="ev-file">Și-au marcat zilele: ${who.map(esc).join(", ")}.</p>`;
  return h;
}

function zile(){const o=[];for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);o.push(`${d.toLocaleDateString("ro-RO",{weekday:"long"})} ${iso(d)}`)}return o.join(", ")}
function sysPrompt(){
  const z=new Date().toLocaleDateString("ro-RO",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return `Ești Sofia, asistenta vocală a firmei Cocktail Philosophy (catering de cocktailuri și barmani la evenimente, Sibiu).
Vorbești cu ${F.NAME||"un coleg"}${F.isAdmin?", administratorul (Paul)":", un membru al echipei"}. Azi este ${z} (${iso(new Date())}).
Reguli:
- Răspunzi DOAR în limba română, scurt și natural, ca într-o conversație la telefon: una-trei propoziții, vorbite, cu cuvinte de zi cu zi („gata”, „am pus”, „mai ai”), fără formulări de robot ca „Am efectuat operațiunea”. Fără markdown, liste cu steluțe sau emoji; textul tău e citit cu voce tare.
- Pentru orice întrebare despre rețete, evenimente, stoc sau contracte chemi funcțiile; nu inventa date. Dacă o funcție dă eroare, spui pe scurt de ce.
- Când ți se cere o acțiune, o faci direct cu funcția potrivită, apoi confirmi într-o propoziție ce ai făcut.
- Datele le dai ca „sâmbătă, 14 noiembrie”, nu AAAA-LL-ZZ. Sumele cu moneda.
- Dacă lipsește o informație absolut necesară, pune o singură întrebare scurtă.
- „Adaugă un eveniment / am o nuntă pe… / fă contract pentru…” = adauga_eveniment, care face tot: salvează contractul, îl pune în calendar și îl deschide pe ecran. Ai nevoie minim de numele clientului și de dată; restul (oră, locație, invitați, preț, avans, telefon) le treci dacă au fost spuse, nu le ceri pe toate. Nu pune tu confirmarea, o cere funcția.
- Dacă funcția răspunde că în ziua aceea există deja evenimente în calendar, i le spui pe scurt și întrebi dacă completezi unul dintre ele sau faci unul nou; apoi pune_in_calendar.
- După adăugare spui ce lipsește din contract pentru PDF (de obicei datele din buletin: „fă o poză buletinului în formular”).
- Prețurile uzuale: dacă utilizatorul spune „euro de persoană”, moneda EURO și unitatea „/ PERSOANĂ”.
- Zilele următoare, ca să calculezi corect datele: ${zile()}.
- Poți face și calcule (cantități pentru un număr de invitați, sume, rest de plată) pe baza datelor din funcții.`;

const badModel=e=>/not.?found|404|unsupported|is not available|invalid.*model/i.test(String(e&&e.message));
function newChat(aiM,ai,m){
  const model=aiM.getGenerativeModel(ai,{model:m,systemInstruction:sysPrompt(),tools:[{functionDeclarations:DECL}],generationConfig:{temperature:0.3}});
  return model.startChat();
}
/* Prima întrebare încearcă modelele pe rând (ca la facturi); după aceea conversația rămâne pe modelul care a mers */
async function first(text){
  const X=window.__cpAI;if(!X||!X.ready())throw new Error("Asistentul are nevoie de serviciul AI al aplicației (cel de la facturi), care nu e configurat.");
  const {aiM,ai}=await X.loadAI();
  let last;
  for(const m of (VS.model?[VS.model]:X.models)){
    const chat=newChat(aiM,ai,m);
    try{const r=await chat.sendMessage(text);VS.model=m;VS.chat=chat;return r}
    catch(e){last=e;if(!badModel(e))throw e}
  }
  throw last;
}
async function ask(text){
  let res=VS.chat?await VS.chat.sendMessage(text):await first(text);
  const chat=VS.chat;
  for(let i=0;i<6;i++){
    const calls=res.response.functionCalls&&res.response.functionCalls();
    if(!calls||!calls.length)break;
    const parts=[];
    for(const c of calls){
      let out;
      try{out=RUN[c.name]?await RUN[c.name](c.args||{}):{eroare:"Funcție necunoscută."}}
      catch(e){out={eroare:errMsg(e)}}
      note(c.name,out);
      parts.push({functionResponse:{name:c.name,response:out}});
    }
    res=await chat.sendMessage(parts);
  }
  return (res.response.text()||"").replace(/[*_#`]/g,"").trim()||"Gata.";
}
function note(name,out){
  const L={deschide_sectiune:"Am deschis secțiunea",retete:"Am căutat în rețetar",evenimente:"Am citit evenimentele",stoc:"Am verificat stocul",contracte:"Am citit contractele",
    marcheaza_incasare:"Încasare",eveniment_nou:"Am deschis fișa nouă",
    adauga_eveniment:"Eveniment nou",calendar_zi:"Am citit calendarul",pune_in_calendar:"Calendar",modifica_contract:"Contract modificat",contract_drive:"PDF în Drive",
    deschide_contract:"Am deschis contractul",descarca_pdf:"PDF descărcat",notita_contract:"Notiță salvată",disponibilitate:"Am verificat disponibilitatea"};
  add("act",(L[name]||name)+(out&&out.eroare?" · nu a mers":out&&out.anulat?" · anulat":" ✓"));
}

const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* Textul spus: fără simboluri citite literă cu literă, abrevieri pronunțate ca în vorbire */
function spoken(t){

};
window.claude={use:async n=>n==="artifact"?artifact:n==="user"?user:n==="db"?db:null};

window.CPFS={fs,base,isAdmin,NAME,UID,cfg:CFG,recaptcha:RECAPTCHA_SITE_KEY};
/* Data și ora: pe telefon deschide direct calendarul / ceasul la atingere oriunde în câmp */
document.addEventListener("click",e=>{const i=e.target;
  if(i&&i.tagName==="INPUT"&&(i.type==="date"||i.type==="time"||i.type==="datetime-local")&&!i.readOnly&&!i.disabled&&typeof i.showPicker==="function"){try{i.showPicker()}catch(x){}}
},true);
runApp();

/* Rândul de jos: cine ești și intrarea de administrator */
const foot=document.querySelector("footer");
if(foot){
  const w=document.createElement("div");w.className="fb-who";
  w.innerHTML=`Ești <b>${escH(NAME)}</b>${isAdmin?" (administrator)":""} · <button type="button" id="fbRename">Schimbă numele</button> · `+
    (isAdmin?`<button type="button" id="fbOut">Ieși din administrare</button>`:`<button type="button" id="fbIn">Intră ca administrator</button>`);
  foot.appendChild(w);
  w.querySelector("#fbRename").onclick=()=>{const v=prompt("Numele tău:",NAME);if(v&&v.trim()){ls.set("cp-name",v.trim());fs.doc(`${base}/oameni/${UID}`).set({name:v.trim()}).finally(()=>location.reload())}};
  const bIn=w.querySelector("#fbIn"),bOut=w.querySelector("#fbOut");
  if(bIn)bIn.onclick=async()=>{
    const p=new firebase.auth.GoogleAuthProvider();
    try{await auth.signInWithPopup(p);location.reload()}
    catch(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))auth.signInWithRedirect(p);else if(e&&e.code!=="auth/popup-closed-by-user")alert("Intrarea nu a reușit: "+(e.code||e.message))}
  };
  if(bOut)bOut.onclick=async()=>{await auth.signOut();location.reload()};
  if(!me.isAnonymous&&!isAdmin){const n=document.createElement("p");n.className="notice";n.textContent="Contul "+me.email+" nu este de administrator. Poți bifa și nota returul, dar nu poți schimba rețetele.";document.querySelector("main")?.prepend(n)}
}
})();
</script>
</body>
</html>
