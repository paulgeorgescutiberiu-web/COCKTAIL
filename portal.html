<style>
:root{--bg:#FFFEF1;--panel:#FFFFFF;--line:#E2D9BF;--fg:#1A1A18;--mut:#5E6359;--or:#C2862D;--ye:#E3B25C;--ok:#25d366;--h:"Anton",Impact,sans-serif;--d:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--b:"Barlow",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b);font-size:17px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-left)) 80px max(18px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:26px}
.brand{font-family:var(--d);font-weight:500;letter-spacing:.08em;color:var(--mut);font-size:15px}.brand b{color:var(--fg);font-weight:800}
h1{font-family:var(--h);font-weight:400;font-size:clamp(40px,11vw,64px);line-height:1.05;margin:0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--or)}
h2{font-family:var(--h);font-weight:400;font-size:30px;text-transform:uppercase;margin:0;display:flex;gap:12px;align-items:center}
h2 .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--or);color:#1A1A18;font-size:20px;flex:none}
h2 .n.done{background:var(--ok);color:#043}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.facts div{min-width:0}.facts span{display:block;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.facts b{font-family:var(--d);font-size:22px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font:700 19px var(--d);letter-spacing:.03em;text-decoration:none;cursor:pointer;color:#1A1A18;background:var(--or)}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ye);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:15px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ck{position:relative;display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:#FFFEF1;min-width:0}
.ck input{position:absolute;opacity:0}
.ck b{font-family:var(--d);font-size:21px;text-transform:uppercase}
.ck small{color:var(--mut);font-size:13px;line-height:1.3}
.ck .z{font-size:11px;color:var(--ok);text-transform:uppercase;letter-spacing:.08em}
.ck.on{border-color:var(--or);background:#F6EBD3}
.ck.on::after{content:"✓";position:absolute;right:12px;top:10px;color:var(--or);font-weight:800}
.ck.off{opacity:.45}
textarea,input[type=text]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#FFFEF1;color:var(--fg);font:inherit}
.pad{width:100%;height:190px;border-radius:12px;background:#fff;touch-action:none;display:block}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.agree input{width:22px;height:22px;margin-top:2px;accent-color:var(--or)}
.okmsg{color:var(--ok);font-weight:600;margin:0}
.err{color:#ff7a7a;margin:0}
.iban{font-family:ui-monospace,Consolas,monospace;font-size:16px;word-break:break-all;background:#FFFEF1;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.foot{color:var(--mut);font-size:14px;text-align:center}
.hide{display:none!important}
.dt-s{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:0;background:#FFFEF1}
.dt-s legend{font-family:var(--d);font-weight:800;font-size:21px;text-transform:uppercase;padding:0 6px;display:flex;align-items:center;gap:8px}.dt-s legend small{font-family:var(--b);font-weight:400;font-size:13px;text-transform:none;color:var(--mut)}
.dt-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-size:14px}.dt-s.dt-ok .dt-n{background:var(--ok);color:#043;font-size:0}.dt-s.dt-ok .dt-n::after{content:"✓";font-size:14px}
.dt-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.dt-q{display:flex;flex-direction:column;gap:5px;min-width:0}.dt-w{grid-column:1/-1}.dt-l{font-size:15px;color:var(--mut)}
.dt-q input[type=text],.dt-q input[type=time],.dt-q textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--fg);font:inherit}
.dt-ops{display:flex;flex-wrap:wrap;gap:6px}.dt-p{position:relative;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;background:#fff;font-size:16px}
.dt-p input{position:absolute;opacity:0;pointer-events:none}.dt-p.on{border-color:var(--or);background:#F6EBD3;font-weight:600}
.dt-lvl{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}.dt-lvl .dt-l{font-family:var(--d);font-size:19px;font-weight:700;color:var(--fg);min-width:80px}
.dt-none{display:flex;gap:10px;align-items:center;margin:0 0 10px;font-size:16px}.dt-none input{width:20px;height:20px;accent-color:var(--or)}
.dt-hide{display:none!important}.dt-st{font-size:14px;color:var(--mut);margin:0}.dt-st.ok{color:#1b8a4a}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--or);transition:width .3s}
@media (max-width:420px){.grid,.dt-g{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap" id="app">

  <p class="mut" id="load">Se încarcă evenimentul…</p>

<script id="cp-det">/*DETALII-START*/
/* Detaliile evenimentului: aceleași întrebări în portalul clientului și în aplicație (la Contracte → „Detalii eveniment”).
   Sursa e aici. La construire (src/detp.py) se pune în aplicație și se copiază în portal.html, între DETALII-START și DETALII-END.
   Datele: un obiect simplu { cheie: valoare, at: data ISO, by: "client" | "paul" }; ține minte varianta cea mai nouă. */
(function(root){
const NIV=["Mai mult","Normal","Deloc"];
const SECT=[
  {k:"program",t:"Programul",q:[
    {k:"oraStart",l:"La ce oră începe barul?",s:"începe",type:"time"},
    {k:"oraFinal",l:"La ce oră se închide barul?",s:"se închide",type:"time"},
    {k:"oraMontaj",l:"De la ce oră avem acces la locație pentru montaj?",s:"acces montaj",type:"time"}]},
  {k:"invitati",t:"Invitații",q:[
    {k:"adulti",l:"Câți adulți vor fi?",s:"adulți",type:"num"},
    {k:"copii",l:"Câți copii sau invitați care nu beau alcool?",s:"copii / fără alcool",type:"num"}]},
  {k:"locatie",t:"La locație",q:[
    {k:"contact",l:"Persoana de contact de la locație (nume și telefon)",s:"contact",type:"text"},
    {k:"bar",l:"Barul va fi",s:"bar",type:"opt",o:["Înăuntru","Afară","Nu știm încă"]},
    {k:"acces",l:"Unde descărcăm marfa, este curent lângă bar, alte detalii",s:"acces",type:"area"}]},
  {k:"sala",t:"Alcool pe mese",q:[
    {k:"whisky",l:"Aveți whisky pe mese?",s:"whisky pe mese",type:"opt",o:["Da","Nu"]},
    {k:"whiskyCine",l:"Cine aduce whisky-ul?",s:"îl aduce",type:"opt",o:["Clientul","Cocktail Philosophy"],if:["whisky","Da"]},
    {k:"whiskySticle",l:"Câte sticle, aproximativ?",s:"sticle",type:"num",if:["whisky","Da"]},
    {k:"alteMese",l:"Ce alte băuturi sunt pe mese? (vin, prosecco, shot-uri)",s:"altele pe mese",type:"area"}]},
  {k:"baze",t:"Preferințe la alcool",q:[
    {k:"bGin",l:"Gin",s:"gin",type:"lvl"},{k:"bRom",l:"Rom",s:"rom",type:"lvl"},{k:"bVodca",l:"Vodcă",s:"vodcă",type:"lvl"},
    {k:"bWhisky",l:"Whisky",s:"whisky",type:"lvl"},{k:"bTequila",l:"Tequila",s:"tequila",type:"lvl"},
    {k:"marci",l:"Mărci preferate (opțional)",s:"mărci",type:"text"}]},
  {k:"cocktail",t:"Cocktailuri în plus",q:[
    {k:"extra",l:"Cocktailuri dorite care nu sunt în meniu",s:"în afara meniului",type:"area"},
    {k:"pers",l:"Vreți un cocktail personalizat, cu numele vostru?",s:"cocktail personalizat",type:"opt",o:["Da","Nu"]},
    {k:"persNume",l:"Ce nume să poarte?",s:"nume",type:"text",if:["pers","Da"]}]},
  {k:"momente",t:"Momente speciale",none:"Nimic special",q:[
    {k:"momente",l:"Toast cu prosecco, shot-uri la miezul nopții, ora tortului…",type:"area"}]},
  {k:"alergii",t:"Alergii și restricții",none:"Nu sunt",q:[
    {k:"alergii",l:"Alergii, intoleranțe sau ingrediente de evitat",type:"area"}]},
  {k:"obs",t:"Observații",opt:true,q:[
    {k:"obsDet",l:"Orice altceva ne-ar ajuta să pregătim barul",type:"area"}]}
];
const KEYS=SECT.flatMap(s=>s.q.map(q=>q.k).concat(s.none?[s.k+"None"]:[]));
const val=(d,k)=>String((d||{})[k]??"").trim();
const vis=(q,d)=>!q.if||val(d,q.if[0])===q.if[1];
function done(s,d){if(s.none&&val(d,s.k+"None"))return true;return s.q.some(q=>vis(q,d)&&val(d,q.k)!=="")}
function progres(d){const S=SECT.filter(s=>!s.opt),ok=S.filter(s=>done(s,d||{}));return {gata:ok.length,total:S.length,complet:ok.length===S.length,lipsa:S.filter(s=>!done(s,d||{})).map(s=>s.t)}}
/* termenul: cu 4 zile înainte de eveniment */
function termen(dataEv){const m=String(dataEv||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return "";return new Date(Date.UTC(+m[1],m[2]-1,+m[3]-4)).toISOString().slice(0,10)}
/* rezumat pe rânduri, pentru fișa evenimentului și calendar */
function rinduri(d){d=d||{};const L=[];
  SECT.forEach(s=>{if(s.none&&val(d,s.k+"None")){L.push(`${s.t}: ${s.none.toLowerCase()}`);return}
    const p=s.q.filter(q=>vis(q,d)&&val(d,q.k)).map(q=>q.s?`${q.s} ${val(d,q.k)}`:val(d,q.k));
    if(p.length)L.push(`${s.t}: ${p.join(" · ")}`)});
  return L}
/* varianta cea mai nouă dintre două (din aplicație și din portal) */
function nou(a,b){if(!a)return b||null;if(!b)return a;return String(b.at||"")>String(a.at||"")?b:a}
/* toate cheile cunoscute, ca text scurt; cele goale rămân "" ca să șteargă valoarea veche la salvarea cu merge */
function curat(d){const o={};KEYS.forEach(k=>{o[k]=val(d,k).slice(0,600)});return o}

/* formularul: aceeași formă în portal și în aplicație; fiecare pagină își pune stilurile pentru clasele dt-* */
function formHTML(d,esc,o){d=d||{};o=o||{};let h="";
  SECT.forEach((s,i)=>{const ok=done(s,d);
    h+=`<fieldset class="dt-s${ok?" dt-ok":""}" data-dts="${s.k}"><legend>${o.nr?`<span class="dt-n">${i+1}</span>`:""}${esc(s.t)}${s.opt?` <small>(opțional)</small>`:""}</legend>`;
    if(s.none)h+=`<label class="dt-none"><input type="checkbox" data-dt="${s.k}None"${val(d,s.k+"None")?" checked":""}> ${esc(s.none)}</label>`;
    h+=`<div class="dt-g">`;
    s.q.forEach(q=>{const v=val(d,q.k),hid=!vis(q,d)||(s.none&&val(d,s.k+"None"))?" dt-hide":"",attr=`data-dt="${q.k}"`;
      const iff=q.if?` data-if="${q.if[0]}=${esc(q.if[1])}"`:"";
      if(q.type==="opt"||q.type==="lvl"){const ops=q.type==="lvl"?NIV:q.o;
        h+=`<div class="dt-q${q.type==="lvl"?" dt-lvl":""}${hid}"${iff}><span class="dt-l">${esc(q.l)}</span><span class="dt-ops">${ops.map(x=>`<label class="dt-p${v===x?" on":""}"><input type="radio" name="dt-${q.k}" value="${esc(x)}" ${attr}${v===x?" checked":""}>${esc(x)}</label>`).join("")}</span></div>`}
      else if(q.type==="area")h+=`<label class="dt-q dt-w${hid}"${iff}><span class="dt-l">${esc(q.l)}</span><textarea rows="2" ${attr}>${esc(v)}</textarea></label>`;
      else h+=`<label class="dt-q${hid}"${iff}><span class="dt-l">${esc(q.l)}</span><input ${q.type==="time"?'type="time"':q.type==="num"?'type="text" inputmode="numeric"':'type="text"'} ${attr} value="${esc(v)}"></label>`});
    h+=`</div></fieldset>`});
  return h}
/* citește valorile din formular */
function citeste(box){const d={};
  box.querySelectorAll("[data-dt]").forEach(i=>{const k=i.dataset.dt;
    if(i.type==="radio"){if(i.checked)d[k]=i.value}else if(i.type==="checkbox"){if(i.checked)d[k]="1"}else if(String(i.value).trim())d[k]=String(i.value).trim()});
  return curat(d)}
/* după o schimbare: arată/ascunde întrebările condiționate, bifează secțiunile gata */
function potriveste(box){const d=citeste(box);
  box.querySelectorAll(".dt-p").forEach(l=>l.classList.toggle("on",l.querySelector("input").checked));
  SECT.forEach(s=>{const fs=box.querySelector(`[data-dts="${s.k}"]`);if(!fs)return;const nn=s.none&&val(d,s.k+"None");
    fs.querySelectorAll(".dt-q").forEach(q=>{const c=q.dataset.if,[a,b]=c?c.split("="):[];q.classList.toggle("dt-hide",!!nn||(c?val(d,a)!==b:false))});
    fs.classList.toggle("dt-ok",done(s,d))});
  return d}
const API={SECT,KEYS,progres,termen,rinduri,nou,curat,formHTML,citeste,potriveste};
if(typeof module!=="undefined"&&module.exports)module.exports=API;else root.CPDet=API;
})(typeof window!=="undefined"?window:globalThis);
/*DETALII-END*/</script>
<script>
(function(){
const CFG={apiKey:"AIzaSyBdnMe0062NUOsIBlRZ1NqKlPniDwWXebI",authDomain:"cocktail-philosophy-dc34b.firebaseapp.com",projectId:"cocktail-philosophy-dc34b",storageBucket:"cocktail-philosophy-dc34b.firebasestorage.app",messagingSenderId:"924422421135",appId:"1:924422421135:web:127a3c78598b64afb84efa"};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON=["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"],DAY=["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
const fd=iso=>{const m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return "";const d=new Date(+m[1],m[2]-1,+m[3]);return `${DAY[d.getDay()]}, ${+m[3]} ${MON[d.getMonth()]} ${m[1]}`};

if(!window.firebase){fail("Pagina nu s-a putut conecta. Verifică internetul și reîncarcă.");return}
firebase.initializeApp(CFG);const fs=firebase.firestore(),ref=fs.doc("portal/"+tok);
let P=null,sel=[],pdfUrl=null;

async function load(){

  if(!d.exists){fail("Linkul nu mai e valabil sau nu există.");return}
  P=d.data();P.resp=P.resp||{};

  sel=P.resp.menuIds?P.resp.menuIds.slice(0,MX):MX>=(P.menuOpts||[]).length?(P.menuOpts||[]).map(o=>o.id):[];
  render();
  if(!P.resp.seenAt){P.resp.seenAt=new Date().toISOString();ref.set({resp:P.resp},{merge:true}).catch(()=>{})}
}
let MN=0,MX=0;
const lim=()=>MX<(P.menuOpts||[]).length;
const cntTxt=()=>lim()?`${sel.length} alese · între ${MN} și ${MX}`:`${sel.length} din ${(P.menuOpts||[]).length} alese`;
function render(){
  const e=P.ev,r=P.resp,signed=!!r.signedAt,menuDone=(r.menu||[]).length>0;
  const tot=(P.menuOpts||[]).length;
  let h=`<div class="brand">COCKTAIL <b>PHILOSOPHY</b>®</div>
  <h1>Bună${P.client.prenume?", "+esc(P.client.prenume):""}!<br><em>Pregătim barul.</em></h1>

    <div><span>Locația</span><b>${esc(e.locatie)}</b></div>${e.invitati?`<div><span>Invitați</span><b>${esc(e.invitati)}</b></div>`:""}
    ${P.doarMeniu?"":`<div><span>Pachet</span><b>${esc(e.pachet)}</b></div><div><span>Preț</span><b>${esc(e.pret)} ${esc(e.moneda)} ${esc(e.unitate)}</b></div>`}
  </div>${P.doarMeniu?"":`<p class="mut">${esc(e.tva)}${e.ore?` · ${esc(e.ore)} ore de servire`:""}</p>`}</div>

  <section class="card"><h2><span class="n done">1</span>Oferta și meniul</h2>
    <div class="row">${(P.oferte||[]).map(o=>`<a class="btn sec" href="${esc(o.u)}" target="_blank" rel="noopener">${esc(o.t)}</a>`).join("")}</div></section>

  <section class="card"><h2><span class="n ${menuDone?"done":""}">2</span>Meniul de cocktailuri</h2>
    <p class="mut">${lim()?`Alegeți între <b>${MN} și ${MX}</b> cocktailuri din cele ${tot}. Vă recomandăm să păstrați și câteva fără alcool.`:`Alegeți ce cocktailuri doriți la bar. <b>Recomandarea noastră: toate</b>, ca fiecare invitat să-și găsească preferatul.`} <b id="cnt">${cntTxt()}</b></p>
    <div class="row">${lim()?"":`<button class="btn sec" type="button" id="all">Le vreau pe toate</button>`}<button class="btn sec" type="button" id="none">Golește alegerea</button></div>
    <div class="grid">${(P.menuOpts||[]).map(o=>{const on=sel.includes(o.id);return `<label class="ck ${on?"on":""}"><input type="checkbox" data-m="${esc(o.id)}" ${on?"checked":""}>${o.zero?`<span class="z">fără alcool</span>`:""}<b>${esc(o.name)}</b><small>${esc((o.ing||[]).join(" · "))}</small></label>`}).join("")}</div>
    <label for="obs" class="mut">Ce alte preferințe aveți pentru meniul de cocktailuri? De exemplu: un cocktail cu numele vostru, mai multe variante fără alcool, mai dulce sau mai sec, alergii, culori pe tema nunții.</label>
    <textarea id="obs" rows="4">${esc(r.obs||"")}</textarea>
    <div class="row"><button class="btn" id="saveMenu">Salvează alegerea</button></div><p class="okmsg hide" id="menuOk">Am salvat alegerea. O vedem imediat.</p></section>

  ${P.doarMeniu?"":`<section class="card"><h2><span class="n ${signed?"done":""}">3</span>Contractul</h2>
    ${P.pdf?`<div class="row"><a class="btn sec" id="pdfBtn" href="#" target="_blank" rel="noopener">Citește contractul (PDF)</a></div>`:`<p class="mut">Contractul vi-l trimitem separat.</p>`}
    ${signed?`<p class="okmsg">✓ Semnat de ${esc(r.nume)} la ${esc(new Date(r.signedAt).toLocaleString("ro-RO",{dateStyle:"long",timeStyle:"short"}))}. Mulțumim!</p>`:`
    <label class="agree"><input type="checkbox" id="agree"><span>Am citit contractul și sunt de acord cu el.</span></label>
    <label for="nume" class="mut">Numele complet</label><input type="text" id="nume" value="${esc(P.client.nume||"")}" autocomplete="name">
    <p class="mut">Semnați cu degetul în chenarul alb:</p>
    <canvas class="pad" id="pad"></canvas>
    <div class="row"><button class="btn sec" id="clr" type="button">Șterge semnătura</button><button class="btn" id="sign" type="button">Semnez contractul</button></div>
    <p class="err hide" id="signErr"></p>`}</section>

  <section class="card"><h2><span class="n">4</span>Avansul</h2>
    <p>Avans: <b>${esc(e.avans)} ${esc(e.monedaAvans)}</b>${e.dataRest?` · diferența până la ${esc(fd(e.dataRest))}`:""}</p>
    ${e.avansPrimit?`<p class="okmsg">✓ Am primit avansul${e.avansPrimit.suma?` de ${esc(e.avansPrimit.suma)} ${esc(e.avansPrimit.moneda||"")}`:""}${e.avansPrimit.data?` pe ${esc(fd(e.avansPrimit.data))}`:""}. Data evenimentului e rezervată. Mulțumim!</p></section>`:`<p class="mut">Prin transfer bancar:</p>
    <div class="iban" id="iban">${esc(P.firma.iban||"")}</div>
    <p class="mut">Beneficiar: ${esc(P.firma.nume||"")}${P.firma.banca?` · ${esc(P.firma.banca)}`:""}<br>Detalii plată: avans eveniment ${esc(fd(e.dataEv))}</p>
    <div class="row"><button class="btn sec" id="cpIban" type="button">Copiază IBAN-ul</button></div></section>`}`}

  ${detHTML()}

  <p class="foot">Întrebări? Scrieți-ne pe WhatsApp: <b>${esc(P.firma.tel||"0743 785 655")}</b><br>Tu te distrezi, noi ne ocupăm de bar. 🍸</p>`;
  A.innerHTML=h;
  if(P.pdf){if(!pdfUrl){const bin=atob(P.pdf),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);pdfUrl=URL.createObjectURL(new Blob([u8],{type:"application/pdf"}))}$("#pdfBtn").href=pdfUrl}
  bind();
}
/* Detaliile evenimentului: se completează oricând, până cu 4 zile înainte; se salvează singure */
const D=window.CPDet;
function detHTML(){
  if(!D)return "";
  const nr=P.doarMeniu?3:5,r=P.resp,deschis=P.doarMeniu||!!r.signedAt,d=r.det||{},pr=D.progres(d),t=D.termen(P.ev.dataEv),azi=new Date().toISOString().slice(0,10);
  if(!deschis)return `<section class="card"><h2><span class="n">${nr}</span>Detalii eveniment</h2><p class="mut">După ce semnați contractul, aici ne spuneți ora, invitații, preferințele la alcool și alte detalii. Nu e grabă: le puteți completa oricând până pe ${esc(fd(t))}.</p></section>`;
  return `<section class="card" id="det"><h2><span class="n ${pr.complet?"done":""}">${nr}</span>Detalii eveniment</h2>
    <p class="mut">${t&&azi>t?`Mai e puțin până la eveniment. Completați ce lipsește, iar pentru schimbări importante sunați-ne.`:`<b>Nu e grabă.</b> Completați câte puțin, oricând până pe <b>${esc(fd(t))}</b>.`} Totul se salvează singur. Ce am vorbit deja la telefon e completat de noi.</p>
    <div class="bar"><i id="detBar" style="width:${Math.round(100*pr.gata/pr.total)}%"></i></div><p class="dt-st" id="detSt">${pr.gata} din ${pr.total} completate</p>
    <div id="detBox" style="display:flex;flex-direction:column;gap:12px">${D.formHTML(d,esc,{nr:1})}</div>
    <p class="dt-st" id="detSave"></p></section>`;
}
let detT=null;
function bindDet(){
  const box=$("#detBox");if(!box||!D)return;
  const st=$("#detSave");
  const upd=()=>{const d=D.potriveste(box),pr=D.progres(d);$("#detBar").style.width=Math.round(100*pr.gata/pr.total)+"%";$("#detSt").textContent=`${pr.gata} din ${pr.total} completate`;
    const n=$("#det .n");n.classList.toggle("done",pr.complet);return d};
  const save=async()=>{const d=upd();st.className="dt-st";st.textContent="Se salvează…";
    P.resp={...P.resp,det:{...d,at:new Date().toISOString(),by:"client"}};
    try{await ref.set({resp:P.resp},{merge:true});st.className="dt-st ok";st.textContent="✓ Salvat"}
    catch(e){st.className="dt-st";st.style.color="#c0392b";st.textContent="Nu am putut salva. Verificați internetul; încercăm din nou la următoarea modificare."}};
  const later=ms=>{clearTimeout(detT);st.className="dt-st";st.textContent="";detT=setTimeout(save,ms)};
  box.addEventListener("change",()=>{upd();later(300)});
  box.addEventListener("input",e=>{if(e.target.matches("input[type=text],textarea"))later(1200)});
}
function bind(){
  bindDet();
  const tot=(P.menuOpts||[]).length;
  const sync=()=>{A.querySelectorAll(".ck").forEach(l=>{const inp=l.querySelector("input"),on=sel.includes(inp.dataset.m);inp.checked=on;l.classList.toggle("on",on)});$("#cnt").textContent=cntTxt();$("#menuOk").classList.add("hide")};
  const say=m=>{$("#menuOk").textContent=m;$("#menuOk").classList.remove("hide")};
  A.querySelectorAll("[data-m]").forEach(i=>i.onchange=()=>{const id=i.dataset.m;
    if(i.checked){if(sel.length>=MX){i.checked=false;say(`Puteți alege cel mult ${MX} cocktailuri. Debifați unul ca să alegeți altul.`);return}if(!sel.includes(id))sel.push(id)}
    else sel=sel.filter(x=>x!==id);sync()});
  if($("#all"))$("#all").onclick=()=>{sel=(P.menuOpts||[]).map(o=>o.id);sync()};
  $("#none").onclick=()=>{sel=[];sync()};
  $("#saveMenu").onclick=async()=>{const b=$("#saveMenu");b.disabled=true;
    if(!sel.length&&!$("#obs").value.trim()){$("#menuOk").textContent="Alegeți măcar un cocktail sau scrieți-ne preferințele.";$("#menuOk").classList.remove("hide");b.disabled=false;return}
    if(lim()&&sel.length&&(sel.length<MN||sel.length>MX)){say(`Alegeți între ${MN} și ${MX} cocktailuri (acum sunt ${sel.length}).`);b.disabled=false;return}
    const names=sel.map(id=>(P.menuOpts.find(o=>o.id===id)||{}).name).filter(Boolean);
    P.resp={...P.resp,menuIds:sel.slice(),menu:names,obs:$("#obs").value.trim(),menuAt:new Date().toISOString()};
    try{await ref.set({resp:P.resp},{merge:true});$("#menuOk").textContent="Am salvat alegerea. O vedem imediat.";$("#menuOk").classList.remove("hide")}
    catch(e){$("#menuOk").textContent="Nu am putut salva. Verificați internetul și încercați din nou.";$("#menuOk").classList.remove("hide")}
    b.disabled=false};
  if($("#cpIban"))$("#cpIban").onclick=()=>{const t=P.firma.iban||"";(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$("#cpIban").textContent="IBAN copiat ✓"},()=>{const r=document.createRange();r.selectNodeContents($("#iban"));const s=getSelection();s.removeAllRanges();s.addRange(r)})};
  const pad=$("#pad");if(!pad)return;
  const dpr=Math.max(1,window.devicePixelRatio||1),W=pad.clientWidth,H=pad.clientHeight;pad.width=W*dpr;pad.height=H*dpr;
  const x=pad.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#111";
  let drawing=false,inked=false,last=null;
  const pt=ev=>{const r=pad.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top}};
  pad.onpointerdown=ev=>{drawing=true;last=pt(ev);pad.setPointerCapture(ev.pointerId)};
  pad.onpointermove=ev=>{if(!drawing)return;const p=pt(ev);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;inked=true};
  pad.onpointerup=pad.onpointercancel=()=>{drawing=false};
  $("#clr").onclick=()=>{x.clearRect(0,0,W,H);inked=false};
  $("#sign").onclick=async()=>{const err=$("#signErr"),show=m=>{err.textContent=m;err.classList.remove("hide")};
    if(!$("#agree").checked)return show("Bifați că ați citit contractul și sunteți de acord.");
    const nume=$("#nume").value.trim();if(nume.length<3)return show("Scrieți numele complet.");
    if(!inked)return show("Semnați în chenarul alb.");
    const c=document.createElement("canvas");c.width=600;c.height=Math.round(600*H/W);const cx=c.getContext("2d");cx.drawImage(pad,0,0,c.width,c.height);
    const sig=c.toDataURL("image/png");if(sig.length>250000)return show("Semnătura e prea mare. Ștergeți și semnați din nou, mai simplu.");
    const b=$("#sign");b.disabled=true;b.textContent="Se trimite…";
    const resp={...P.resp,sig,nume,signedAt:new Date().toISOString(),ua:navigator.userAgent.slice(0,180)};
    try{await ref.set({resp},{merge:true});P.resp=resp;render();window.scrollTo({top:0})}
    catch(e){b.disabled=false;b.textContent="Semnez contractul";show("Nu am putut trimite semnătura. Verificați internetul și încercați din nou.")}};
}
load();
})();
</script>
