# Publică pe Instagram + Facebook postările puse în social/coada/<id>/ (poza.jpg + text.txt).
# Trimite poza și textul la scenariul Make.com (secretul MAKE_WEBHOOK_URL), apoi mută dosarul în social/postate/.
name: Postare social
on:
  push:
    branches: [main]
    paths: ["social/coada/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  posteaza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trimite postările din coadă
        env:
          HOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if [ -z "$HOOK" ]; then echo "Lipsește secretul MAKE_WEBHOOK_URL"; exit 1; fi
          shopt -s nullglob
          done_any=0
          for d in social/coada/*/; do
            id=$(basename "$d"); img=$(ls "$d" | grep -iE '\.(jpe?g|png)$' | head -1)
            [ -z "$img" ] && continue
            url="https://raw.githubusercontent.com/$REPO/main/social/postate/$id/$img"
            mkdir -p social/postate && git mv "$d" "social/postate/$id"
            git config user.name "cocktail-bot"; git config user.email "bot@users.noreply.github.com"
            git commit -qm "Postat: $id [skip ci]"; git push -q
            for i in $(seq 1 20); do code=$(curl -s -o /dev/null -w '%{http_code}' "$url"); [ "$code" = 200 ] && break; sleep 3; done
            jq -n --arg id "$id" --arg image_url "$url" --rawfile caption "social/postate/$id/text.txt" \
              '{id:$id,image_url:$image_url,caption:$caption}' > /tmp/p.json
            curl -sf -X POST -H 'Content-Type: application/json' --data @/tmp/p.json "$HOOK"
            echo "Trimis: $id"; done_any=1
          done
          [ $done_any = 1 ] || echo "Nimic în coadă"
